# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # parquet's arrow reader returns arrow's types: bumped apart, the
      # dataset benches hand one arrow's record batches to another's writer.
      arrow:
        patterns:
          - "arrow"
          - "parquet"
      # The OTLP exporter and the tracing layer each speak one
      # opentelemetry_sdk's traits: bumped apart, the `otel` feature stops
      # compiling.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
      # One repo releases all three at one version, and the grammar guide
      # runs llguidance's parser over the token trie toktrie_hf_tokenizers
      # builds: bumped apart, llguidance pulls toktrie along but leaves
      # toktrie_hf_tokenizers behind, pairing releases never shipped together.
      llguidance:
        patterns:
          - "llguidance"
          - "toktrie*"
      # The chat template hands minijinja-contrib's pycompat method callback
      # to minijinja's Environment: bumped apart, two minijinjas land in the
      # tree and the callback's `State` is the other one's, so serving stops
      # compiling.
      minijinja:
        patterns:
          - "minijinja*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

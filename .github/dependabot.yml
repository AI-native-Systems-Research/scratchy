# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # parquet's arrow reader returns arrow's types: bumped apart, the
      # dataset benches hand one arrow's record batches to another's writer.
      arrow:
        patterns:
          - "arrow"
          - "parquet"
      # The OTLP exporter and the tracing layer each speak one
      # opentelemetry_sdk's traits: bumped apart, the `otel` feature stops
      # compiling.
      opentelemetry:
        patterns:
          - "opentelemetry*"
          - "tracing-opentelemetry"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

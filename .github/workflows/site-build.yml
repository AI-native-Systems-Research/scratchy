name: Site build

# The site's one build, called by main's pages.yml and by the site branch's own pages.yml. The site
# lives on the site branch; it renders files from main (docs/, CONTRIBUTING.md, the DSLs), which it
# reads from the folder above its own. So this checks out main at the root and the site branch at
# site/, then checks formatting, lints, tests and renders the site, and deploys it when asked.
#
# The two branches are coupled here. The site branch builds with main's copy of this file
# (site-build.yml@main), so a change to it that needs a matching change on the site branch (a new
# input, a new step the renderer depends on) must land on both, main's first. And the metal
# round's bot dispatches pages.yml by that path on a branch made from site, so main must keep
# .github/workflows/pages.yml at that path: a dispatch finds a workflow by its file on main.
on:
  workflow_call:
    inputs:
      main_ref:
        description: The main ref to check out at the root (its docs and DSLs are rendered)
        type: string
        required: true
      site_ref:
        description: The site branch ref to check out at site/ (the renderer and its data)
        type: string
        required: true
      deploy:
        description: Deploy the rendered site to Pages
        type: boolean
        default: false

jobs:
  build:
    # Forks don't have Pages enabled, so configure-pages would fail there.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.main_ref }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.site_ref }}
          path: site

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      # The site crate is its own workspace, so the repo-wide gates in rust.yml never see it:
      # format-check, lint and test it here. --locked: the site branch's Cargo.lock is the build's.
      - name: Format, lint and test the site renderer
        run: |
          cargo fmt --manifest-path site/Cargo.toml --all -- --check
          cargo clippy --locked --manifest-path site/Cargo.toml --all-targets -- -D warnings
          cargo test --locked --manifest-path site/Cargo.toml

      - name: Build site
        run: cargo run --locked --release --manifest-path site/Cargo.toml

      - if: inputs.deploy
        uses: actions/configure-pages@v6

      - if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

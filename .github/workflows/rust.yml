name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# cancel any prior runs for this workflow and this PR (or branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Linux / amd64 — CUDA backend.
  #
  # The workspace can't build featureless (the layer `load(&mut GpuWeights)`
  # methods consume a backend allocator), and `vllm-cuda` hard-depends on
  # `cudarc` (nvcc), so a GPU backend feature is required. We install only the
  # nvcc + cudart sub-packages via the network installer and cache them.
  #
  # Compile + lint only where a GPU is required: the hosted runner has none, so
  # kernel tests can't run here. What needs no GPU is tested — see the
  # bench-harness steps at the end of the job.
  #
  # linux-arm64 is intentionally absent: nothing this job covers branches on
  # architecture. The bench harness is the case in point — six `target_os` cfgs
  # and zero `target_arch` ones, because the axis that divides it is Linux vs
  # macOS, and both sides already have a job. CUDA has no aarch64 story in this
  # build either, so a fifth job would re-run identical tests on identical code.
  # ---------------------------------------------------------------------------
  linux-cuda:
    name: linux-amd64 (cuda)
    runs-on: ubuntu-latest
    # The runner has no GPU, so codegen can't probe `nvidia-smi` for the
    # target SM. Pin it explicitly (H100 = SM90): SCRATCHY_GPU for
    # codegen, CUDA_COMPUTE_CAP for the cuda build script.
    #
    # SCRATCHY_SKIP_CUDA_KERNELS skips scratchy-builder-cuda's nvcc compile
    # (cutlass + FlashAttention-3 + flashinfer) — tens of minutes and several
    # GB of RAM that OOM the runner. check/clippy don't link the kernels, so
    # the full Rust surface still type-checks. The kernels can't run here
    # anyway (no GPU); they're validated on real hardware.
    env:
      SCRATCHY_GPU: h100
      CUDA_COMPUTE_CAP: "90"
      SCRATCHY_SKIP_CUDA_KERNELS: "1"
      # Same idea for the spyre side: `--workspace` also builds
      # scratchy-target-spyre (and its flex-rs path dep), whose build script
      # compiles C++ against the IBM Spyre SDK headers. The runner has no SDK,
      # so skip the C++ shim compile — check/clippy don't link it. This is the
      # escape hatch that build script documents for exactly this case.
      SCRATCHY_SKIP_SENDNN_CXX: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Cache CUDA toolkit
        uses: actions/cache@v6
        with:
          path: /usr/local/cuda-12.6
          key: ${{ runner.os }}-cuda-12.6

      # Gate the install on whether nvcc actually exists on disk, not on the
      # cache-hit flag: a partial/empty cache entry (common under `act`) reports
      # a hit but leaves no toolkit, so a flag-based skip would never install it.
      - name: Probe CUDA toolkit
        id: cuda
        run: |
          if [ -x /usr/local/cuda-12.6/bin/nvcc ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install CUDA toolkit
        if: steps.cuda.outputs.present != 'true'
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.6.0"
          method: "network"
          sub-packages: '["nvcc", "cudart"]'

      # The cuda-toolkit action only puts nvcc on PATH and sets CUDA_PATH when
      # it actually runs; when the install is skipped the env is left unset.
      # Export them explicitly so `cudarc`'s build script (`nvcc --version`)
      # finds the toolkit on every run.
      - name: Export CUDA toolkit env
        run: |
          echo "/usr/local/cuda-12.6/bin" >> "$GITHUB_PATH"
          echo "CUDA_PATH=/usr/local/cuda-12.6" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-cuda
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy is a superset of `cargo check`, so we run only clippy. The
      # metal crates depend unconditionally on `objc2` (Apple-only) and can't
      # compile on Linux — exclude them.
      #
      # BOTH of them: every consumer's edge to metal is already `optional` and
      # gated on a `metal` feature, so `-Fcuda` pulls in neither via the
      # dependency graph. `--workspace` is what reaches them — it builds every
      # MEMBER as its own root, before features are ever consulted. Listing
      # only `scratchy-target-metal` left `scratchy-target-metal-compiler` (a
      # separate member since it was split out) building as a root, and it
      # depends unconditionally on `scratchy-target-metal`, so `objc2` came
      # back in through the side door.
      #
      # `mtp` compiles the multi-token-prediction head of every model in `all`
      # whose checkpoint carries one (heads have no configs of their own).
      - name: Clippy
        run: cargo clippy --workspace --features cuda,scratchy-models/all,scratchy-models/mtp
          --exclude scratchy-target-metal
          --exclude scratchy-target-metal-compiler
          -- -D warnings

      # Multi-node tensor parallelism (the TCP control plane + NCCL bootstrap
      # in serving-api/-worker) compiles only under `nccl`, which the clippy
      # above never enables. Its own step, not a feature added above: `nccl`
      # changes the forward macro's codegen and has `not(nccl)` paths of its
      # own, so swapping it in would drop coverage, and every model expanded
      # twice would double that step. One small model is the whole Rust
      # surface here. `--all-targets` lints both crates' test builds too (the
      # tests themselves run featureless, below: a `cuda` test binary can't
      # link without the kernels SCRATCHY_SKIP_CUDA_KERNELS skips). The model
      # feature resolves through the worker's dependency, so scratchy-models
      # is built, not selected: its own test targets stay out of this step.
      - name: Clippy (nccl)
        run: cargo clippy -p scratchy-serving-api -p scratchy-serving-worker --all-targets
          --features scratchy-serving-api/nccl,scratchy-models/smollm2-135m
          -- -D warnings

      # The e2e tests' cuda half, type-checked and linted: the macOS e2e step
      # compiles their cuda-only files empty, and the workspace clippy above has
      # no `--tests`, so no other step builds them. `otel` is on so e_otel.rs,
      # which needs it and runs on any backend, compiles too: here rather than
      # on macOS, whose tests job is the longer one. `--keep-going` reports
      # every failing test target, not just those in flight at the first failure.
      - name: Lint the cuda e2e tests
        run: cargo clippy -p scratchy-e2e -p scratchy-models
          --features e2e,cuda,otel,scratchy-models/smollm2-135m
          --tests --keep-going -- -D warnings

      # scratchy-cli's own test targets (its unit tests and
      # tests/arch_feature_passthrough.rs), type-checked and linted: no other
      # step builds them. None is backend-specific, so they're linted here
      # rather than on macOS, whose tests job is the longer one.
      - name: Lint scratchy-cli's test targets
        run: cargo clippy -p scratchy-cli --features cuda,claude,model/smollm2-135m
          --all-targets -- -D warnings

      # The multi-node control plane, the rank rendezvous and the channel
      # that carries `ControlMessage` to followers, is plain TCP + serde: no
      # backend, no GPU. Only NCCL's own collectives need the hardware.
      # Featureless, these are the same crate builds the bench steps use.
      - name: Multi-node control plane tests (no backend feature)
        run: cargo test -p scratchy-serving-transport -p scratchy-serving-worker
          --lib -- tcp_store multinode

      # The scheduler is backend-neutral — its tests need no hardware, and no
      # other step runs them (deps of `-p` test steps don't run transitively,
      # and the workspace clippy is lib+bins only). Includes the multi-wave
      # chunked-prefill contract: a prompt longer than one budget must come
      # back as full-slice continuation waves, which the spyre worker's
      # batched-prefill gate keys on.
      - name: Scheduler tests (backend-neutral)
        run: cargo test -p scratchy-serving-scheduler --lib

      # The GDN state-slot allocator is plain Rust: no backend, no GPU, and no other step runs its
      # unit tests. The engine's (its memory-budget arithmetic) run in the guided-decoding step
      # below, whose feature only adds code.
      - name: Slot-allocator unit tests (no backend feature)
        run: cargo test -p scratchy-forward-compiler --lib

      # The `--workspace` clippy above has no `--all-targets`: it builds
      # lib+bins only, so every `#[cfg(test)]` block in the workspace is
      # invisible to it and no job anywhere compiles them. These three steps
      # close that for the one crate whose tests need no hardware at all.
      #
      # `--all-targets` can't simply be added to the workspace clippy: it would
      # also build ktir-emulator's two known-broken examples (bench,
      # ktir_diff_run) — the pre-existing MTL3->MTL4 gap documented at the KTIR
      # steps in macos-metal-tests, which is why those use `--lib --tests`.
      # Hence a `-p`-scoped step instead.
      #
      # No backend feature, deliberately. scratchy-bench is `default = []` with
      # `cuda`/`metal` as pure pass-throughs to scratchy-serving-api and no
      # backend cfg of its own, so the one feature that changes what compiles
      # is `datasets` (the parquet RAG subcommands), and neither side of it
      # needs a GPU. Each side has code only it compiles: featureless, the arm
      # that answers those subcommands with a rebuild hint; `datasets`, the
      # arrow/parquet readers. Nothing else enables `datasets`, so a lint of
      # one side is blind to the other — and the readers are exactly what an
      # arrow or parquet bump can break (they hand parquet's record batches to
      # arrow's JSON writer, which only type-checks when both resolve to the
      # same arrow). Hence a lint of each. The tests run under `datasets`: no
      # test is featureless-only, so
      # that is a superset, adding the parquet-to-query tests to the whole
      # executable coverage of the startup harness's process handling —
      # process groups, kill(-pgid), wait4/ECHILD — which is kernel/libc
      # semantics with no GPU in it.
      #
      # No `--locked`: the featureless resolution differs from the committed
      # Cargo.lock (cargo adds cblas-sys 0.1.4 alongside 0.3.0), and no other
      # step here uses it either. That staleness is a separate fix.
      - name: Clippy (bench test targets)
        run: cargo clippy -p scratchy-bench --all-targets -- -D warnings

      - name: Clippy (bench test targets, parquet datasets)
        run: cargo clippy -p scratchy-bench --all-targets --features datasets -- -D warnings

      - name: Bench harness tests (no backend feature)
        run: cargo test -p scratchy-bench --features datasets

      # Nothing else enables scratchy-core-common's `otel` feature, so no
      # other step compiles the OpenTelemetry export. Its OTLP exporter,
      # tracer provider and tracing layer only type-check when every
      # OpenTelemetry crate resolves to one version, which is exactly what a
      # bump of one of them breaks. `otel` only adds code, so this lint and
      # test run is a superset of the featureless ones. No backend feature:
      # telemetry has no GPU in it.
      - name: Clippy (OpenTelemetry export)
        run: cargo clippy -p scratchy-core-common --all-targets --features otel -- -D warnings

      - name: OpenTelemetry export tests
        run: cargo test -p scratchy-core-common --features otel

      # The grammar guide behind structured output (JSON schema, regex, EBNF,
      # structural tags) is linted above, since scratchy-e2e turns
      # `guided-decoding` on by default, but that clippy has no
      # `--all-targets`: its tests never compile, and no step runs them. They
      # are what an llguidance bump breaks without breaking the build: a
      # release changes which tokens a grammar allows, not the API. No backend
      # feature: the guide masks token ids on the CPU, and the tests build
      # their tokenizer inline. `guided-decoding` only adds code, so this is a
      # superset of the featureless run. scratchy-core-model rides along: its
      # tests and test targets need no hardware either, and no other step
      # compiles them.
      - name: Clippy (guided-decoding test targets)
        run: cargo clippy -p scratchy-serving-engine -p scratchy-core-model --all-targets
          --features scratchy-serving-engine/guided-decoding -- -D warnings

      - name: Guided-decoding grammar tests
        run: cargo test -p scratchy-serving-engine -p scratchy-core-model
          --features scratchy-serving-engine/guided-decoding

      # The serving layer's unit tests with `guided-decoding`, as every `scr serve` build has it:
      # its tests of a grammar the server builds, such as `tool_choice: "required"`'s (#765), run
      # it through that guide. The macOS serving-layer step builds without the feature, so it
      # compiles those tests out. No backend feature, as above.
      - name: Serving-layer unit tests (guided-decoding)
        run: cargo test -p scratchy-serving-api --features serve,guided-decoding --lib

  # ---------------------------------------------------------------------------
  # Whether this run needs the macOS jobs. A PR whose every changed file is in
  # a crate no macOS job compiles (the Spyre target and its triton re-host
  # crates) skips both; a push to main always runs them. The list, and the lock
  # each macOS job ends with that keeps it true, are in
  # scripts/ci-macos-scope.sh.
  #
  # Only a successful `macos=false` skips them. GitHub counts a skipped
  # required check as passing, so their `if:` fails closed: `!cancelled()`
  # drops the implicit `success()` that would otherwise skip them whenever
  # this job fails.
  # ---------------------------------------------------------------------------
  macos-scope:
    name: macOS scope
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      # A PR checks out its merge commit, whose first parent is main: two
      # commits of history are the PR's whole diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            scripts/ci-macos-scope.sh changed HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            echo macos=true >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # macOS / arm64 — Metal backend.
  #
  # `scratchy-models` (built here with `all-arches`) is the umbrella that
  # compiles the whole Metal inference stack plus every per-arch model crate. The full
  # `--workspace` is not buildable here because cuda-only crates (vllm-cuda)
  # require nvcc. The runner has a real Apple GPU, so kernel tests run.
  #
  # macos-26 (Tahoe) is required: the metal kernels target Metal 4 and the
  # `scratchy-target-metal` build script compiles shaders against the
  # MetalPerformancePrimitives framework, which ships only in the Xcode 26 /
  # macOS 26 SDK (absent on macos-14/15).
  #
  # Two jobs, run in parallel. The whole-catalog clippy is one rustc
  # invocation over every stem (~13 min), longer than every other step
  # combined. The two share no build output: clippy writes check metadata,
  # and every `cargo test` step rebuilds the workspace in the `test` profile
  # anyway. Both are required checks in the branch rules.
  # ---------------------------------------------------------------------------
  macos-metal-clippy:
    name: macos-arm64 (metal clippy, all models)
    needs: macos-scope
    if: ${{ !cancelled() && !(needs.macos-scope.result == 'success' && needs.macos-scope.outputs.macos == 'false') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-metal-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy is a superset of `cargo check`, so we run only clippy + test.
      # `turboquant` is on in every default `scr` build but not in
      # scratchy-models' own (empty) default, so name it: every model then
      # expands with the KV codec users get, and the lowering's check that a
      # TurboQuant model's tape compresses its KV runs across the whole catalog.
      # `mtp` adds the multi-token-prediction head of every model whose
      # checkpoint carries one (heads have no configs of their own).
      - name: Clippy
        run: cargo clippy -p scratchy-models --features metal,all,mtp,turboquant -- -D warnings

      # The other half of macos-scope's skip: fails if this job compiled a crate
      # whose PRs skip it.
      - name: Compiled no crate macos-scope skips for
        run: scripts/ci-macos-scope.sh lock

  macos-metal-tests:
    name: macos-arm64 (metal tests)
    needs: macos-scope
    if: ${{ !cancelled() && !(needs.macos-scope.result == 'success' && needs.macos-scope.outputs.macos == 'false') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-metal-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `all` is model stems only, so the macos-metal-clippy job never turns
      # `hf-completions` on and its build-script path (the huggingface.co query
      # in hf_registry_build.rs) would otherwise go entirely unlinted. Scoped to
      # the smallest stem: one arch, one Hub query. Runners have network; a Hub
      # outage degrades to an empty registry rather than failing the build.
      - name: Clippy (hf-completions)
        run: cargo clippy -p scratchy-models --features metal,smollm2-135m,hf-completions -- -D warnings

      # `cargo test -p scratchy-models` runs ZERO tests — that crate is a pure
      # re-export umbrella with no test targets, and a dependency's integration
      # tests don't run transitively. Test the crate that actually holds the
      # GPU kernel suite (~155 tests: qmm/qmv/softmax/attention/rope/moe vs CPU
      # reference). The macos-26 runner has a real Apple GPU, so these execute.
      - name: Kernel tests
        run: cargo test -p scratchy-target-metal

      # KTIR (Spyre IR) test suites: the emulator's dialect/interpreter/Metal-
      # backend unit + integration tests, and the optimizer's IR->IR pass
      # tests (fusion, tile-coalesce, head-rewrite, flash-attn). Both crates'
      # tests were silently rotted (888 compile errors) behind an MTL3->MTL4
      # migration that never updated them; this locks them back into CI so
      # that can't happen again. `--features metal` runs the real
      # Metal-4-backed emulator tests (nax/amx/simdgroup matmul vs oracle) on
      # this runner's GPU, not just the CPU interpreter path.
      # `--lib --tests` (not a plain `cargo test`): ktir-emulator's two
      # examples (bench, ktir_diff_run) still call the deleted textual MLIR
      # parser and a couple of now-pub(crate) executor entry points — a
      # pre-existing gap from the MTL3->MTL4 migration, out of scope for this
      # lockdown (fixing it means either resurrecting the parser or widening
      # the executor's public surface, both real design calls). Excluding
      # them from `cargo test` here does not skip any test coverage.
      - name: KTIR emulator tests
        run: cargo test -p ktir-emulator --features metal --lib --tests

      - name: KTIR optimizer tests
        run: cargo test -p ktir-optimizer

      # Variant-selection gates (#202). These decide WHICH compiled model
      # variant claims a checkpoint, and both halves fail OPEN — a broken
      # pattern matcher or a dropped per-layer row rejects nothing, so the
      # symptom is a silent mis-load, not a red test. Nothing else in CI
      # reaches them: the workspace clippy has no `--all-targets`, and a
      # dependency's tests do not run transitively (see the `cargo test -p
      # scratchy-models` note above). scratchy-layers holds the runtime half
      # (`affine_pattern_matches`, `affine_widths_agree_in`) and needs no
      # features.
      - name: Variant-selection gate tests (scratchy-layers)
        run: cargo test -p scratchy-layers --lib

      # The compile-time half: the per-(stem, preset) width resolution and the
      # row collection/compression feeding it, plus the quant-config parser
      # under it. Filtered to those two suites rather than the whole lib —
      # 15 tests in `classify`/`config`/`shape`/`parse_python`/`codegen::tests`
      # and the `fp8_block_disambiguation` trio are PRE-EXISTING failures
      # (`load_dir` filters every stem through `CARGO_FEATURE_<STEM>`, which a
      # proc-macro crate cannot set, so those tests select zero configs — the
      # `config_of` doc comment in codegen.rs spells this out). Same class of
      # rot as the KTIR suites above; fixing them is its own change. Widen this
      # filter as they are fixed. `head_ladder_tests`: the check the models'
      # build runs that an MTP head reaches its target's top rung (#600).
      - name: Variant-selection gate tests (forward-compiler macro)
        run: cargo test -p scratchy-forward-compiler-macro --features metal --lib
          -- quantization::tests codegen::fingerprint_tests head_ladder_tests
          --skip fp8_block_disambiguation

      # Type-check scratchy-models' INTEGRATION tests (`tests/*.rs`). Nothing
      # else does: every clippy step is `--lib`-shaped and the `cargo test`
      # steps above are `--lib` too, so these files only ever compile on a
      # developer's machine. They call `try_load` / the metal allocator
      # directly, so they rot the moment either surface changes — this PR had
      # to repair two of them after `try_load` gained a typed result, and CI
      # would not have noticed.
      #
      # Deliberately a NARROW model scope, not `all` (every config's expansion
      # and bake). These three stems compile carrier_parity, metal_o2_logits
      # and qwen3_py_parity (`qwen3-0.6b` is its `[[test]]` required feature:
      # without it the file rotted unbuilt).
      - name: Model-crate integration tests type-check
        run: cargo clippy -p scratchy-models --tests
          --features metal,qwen3.5-35b-a3b,qwen3.6-35b-a3b,qwen3-0.6b -- -D warnings

      # Serving-layer unit tests: tool-call parsers (Hermes / Llama / Kimi /
      # Mistral / Jamba / Granite / Gemma-4), chat-template rendering, the
      # Anthropic `/v1/messages` translation. Pure logic, no GPU and no real
      # model at runtime, but scratchy-models has no default model scope
      # (build-time panic otherwise), so name the smallest one.
      #
      # `serve` is required, not optional: without it `anthropic` and `server`
      # are not compiled, so their tests cannot run.
      - name: Serving-layer unit tests
        run: cargo test -p scratchy-serving-api -p scratchy-models
          --features metal,serve,scratchy-models/smollm2-135m --lib

      # The quarantined per-tool-spans path (#193) is off by default, so
      # nothing above compiles it. Type-check it and run its gated tests so it
      # cannot rot. Cheap: same deps as the step above, one extra cfg.
      - name: Serving-layer unit tests (tool-spans quarantine)
        run: cargo test -p scratchy-serving-api -p scratchy-models
          --features metal,serve,tool-spans,scratchy-models/smollm2-135m --lib

      # The metal e2e tests boot a server on a real model, so they need a Metal 4
      # GPU. This runner's paravirtual GPU has none, so each test would return
      # early (`skip_if_no_gpu!`) and pass without running. What CI can check
      # here is that the files compile and lint clean; run them on a real GPU.
      # `--tests` type-checks every e2e test target (a cuda-only file compiles
      # empty here), and, since `-p scratchy-models` is what names the model,
      # scratchy-models' own lib and integration tests at that model. e_otel.rs
      # and scratchy-cli's test targets are linted in the cuda job. `--keep-going`
      # as in the cuda e2e lint.
      - name: Lint the metal e2e tests
        run: cargo clippy -p scratchy-e2e -p scratchy-models
          --features e2e,metal,scratchy-models/smollm2-135m
          --tests --keep-going -- -D warnings

      # See the clippy job's last step.
      - name: Compiled no crate macos-scope skips for
        run: scripts/ci-macos-scope.sh lock

  # ---------------------------------------------------------------------------
  # Linux / amd64 — Spyre emulator, non-Accelerate BLAS backends.
  #
  # ktir-emulator's `blis`/`mkl`/`openblas` features (the real IBM Spyre
  # deployment's BLAS choices, run on Linux) are otherwise never built or
  # tested anywhere: linux-cuda only compiles ktir-emulator with default
  # (no-BLAS) features, and on the macOS jobs its `[target.'cfg(target_os =
  # "macos")'.dependencies.blas-src]` block is unconditional (always
  # Accelerate) — selecting `openblas`/`mkl` there collides with it. This job
  # is the only place a non-Accelerate BLAS backend actually links and runs.
  #
  # `openblas-system` (dynamic link against the distro's libopenblas via
  # pkg-config) rather than building OpenBLAS from source: minutes faster and
  # doesn't need gfortran. `blis`/`mkl` aren't covered here yet — from-source
  # BLIS already fails to build locally on aarch64 (a separate, pre-existing
  # issue) and MKL needs a heavier Intel install; revisit if Spyre deploys
  # actually depend on either.
  # ---------------------------------------------------------------------------
  linux-spyre-emu:
    name: linux-amd64 (spyre-emu blas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenBLAS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-spyre-emu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (openblas-system)
        run: cargo clippy -p ktir-emulator --no-default-features --features optimizer,openblas-system -- -D warnings
      - name: Test (openblas-system)
        run: cargo test -p ktir-emulator --no-default-features --features optimizer,openblas-system --lib --tests

  # ⭐ THE TRITON SPLICE'S OWN GATE. The splice is now the ONLY producer for the
  # spliced op kinds (unconditional in `lower_one_node`), so every job that builds
  # the spyre target compiles it — this job remains the one that runs the splice's
  # OWN tests at `-D warnings`: the splice golden
  # (`tests/triton_splice_golden.rs`, which lowers every registered op through
  # the splice and pins each row's op name, attention mask slot, and the
  # emulator numeric checks) plus the spyre-emu-gated execution tests.
  # `--lib --tests`, not bare `cargo test`: the crate's two
  # `examples/` need `spyre-hw` (a card host), same exclusion the macOS job
  # documents for ktir-emulator.
  # Ubuntu (not macOS): `spyre-emu` pulls openblas, which the distro provides; the
  # macOS build would collide with Accelerate in the same way the linux-spyre-emu
  # job documents.
  #
  # The re-hosted triton crates (frontend, ktir, ktir-superdsc, numeric, splice)
  # are pure Rust — no hardware — but the linux-cuda job's workspace clippy has
  # no `--all-targets`, so nothing else in CI compiled their tests or examples:
  # the 141 ktir tests, the stale-golden pins PROVENANCE.md leans on, and the
  # splice's own cache-probe example were all local-only until this step. A
  # bare `cargo test` is right here (their examples need no card, unlike the
  # spyre target's), so the examples' compile errors are caught too.
  linux-spyre-triton:
    name: linux-amd64 (spyre triton splice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenBLAS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libopenblas-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-spyre-triton
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (spyre triton)
        run: cargo clippy -p scratchy-target-spyre --features spyre-emu --all-targets -- -D warnings
      - name: Test (spyre triton golden + emu execution)
        run: cargo test -p scratchy-target-spyre --features spyre-emu --lib --tests
      # The worker's spyre modules compile under no other CI job (the linux-cuda
      # workspace steps build the worker with default features only), so their
      # unit tests run here on the emu stack this job already builds — including
      # the decode-routing predicate that keeps 1-token slices of unfinished
      # prompts out of batched decode. A model feature must be named (zero-model
      # is a build-time panic); granite is the one the card builds use.
      - name: Test (spyre worker unit tests)
        run: cargo test -p scratchy-serving-worker
          --features spyre-emu,scratchy-models/granite-3.1-8b-instruct --lib
      # The same modules at -D warnings, all targets: no other step lints them, so lint debt
      # piled up unseen (#616's 9 errors). llama-3.2-1b is the smallest model whose bundles bake
      # clean here.
      - name: Clippy (spyre worker, emulator)
        run: cargo clippy -p scratchy-serving-worker
          --features spyre-emu,scratchy-models/llama-3.2-1b --all-targets -- -D warnings
      # The spyre-side ktir-superdsc and spyre-bundle crates' TEST targets compile
      # under no other CI step: this job's clippy above is -p scratchy-target-spyre,
      # the triton clippy below is the five re-host crates, and the linux-cuda job's
      # workspace clippy has no --all-targets, so workspace members' test builds
      # never happen there. #714's dangling `Df::Fp8` sat in exactly that gap (the
      # import deleted with MatmulStaging, the usage left in
      # zz_a_one_row_matmul_fills_every_core.rs) — main could not compile that test
      # binary and no check was red. This leg is the compile cover for that class.
      - name: Test (spyre ktir-superdsc + bundle)
        run: cargo test -p ktir-superdsc -p scratchy-spyre-bundle
      # scratchy-subtile's lib and integration tests ran in no step, so they rotted unseen (#542:
      # a missing initializer field kept the lib tests from compiling). Pure Rust, no device, on
      # the ktir-superdsc build the step above leaves. Under `spyre`, which gates no test out; and
      # featureless, the build metal links, whose test targets must compile too.
      - name: Test (scratchy-subtile, spyre)
        run: cargo test -p scratchy-subtile --features spyre
      - name: Test (scratchy-subtile, featureless)
        run: cargo test -p scratchy-subtile
      - name: Clippy (triton re-host crates, all targets)
        run: cargo clippy -p triton-frontend -p triton-ktir -p triton-ktir-superdsc -p triton-numeric -p scratchy-triton-splice --all-targets -- -D warnings
      - name: Test (triton re-host crates)
        run: cargo test -p triton-frontend -p triton-ktir -p triton-ktir-superdsc -p triton-numeric -p scratchy-triton-splice

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  scripts:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Standard library only (scripts/cc_trace.py and its tests): no install step.
      - run: python3 -m unittest discover -s scripts/tests -v

name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The metal round's bot commit (metal-round.yml) starts no workflows by itself, so the bot
  # starts this one on the round's branch.
  workflow_dispatch:

permissions:
  contents: read

# cancel any prior runs for this workflow and this PR (or branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Linux / amd64 — whole-workspace lint, of both workspaces: the root one's
  # Linux-buildable members, and the Spyre target's own (targets/spyre).
  #
  # Metal is Apple-only, so the root workspace is linted here without it; the
  # spyre workspace is linted at one model. The runner has no Spyre card, so
  # nothing here runs on hardware. What needs no hardware is tested — see the
  # steps after the clippies.
  #
  # linux-arm64 is intentionally absent: nothing this job covers branches on
  # architecture. The bench harness is the case in point — six `target_os` cfgs
  # and zero `target_arch` ones, because the axis that divides it is Linux vs
  # macOS, and both sides already have a job.
  # ---------------------------------------------------------------------------
  linux-workspace:
    name: linux-amd64 (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-workspace
          workspaces: |
            . -> target
            targets/spyre -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy is a superset of `cargo check`, so we run only clippy. The
      # metal crates depend unconditionally on `objc2` (Apple-only) and can't
      # compile on Linux — exclude them.
      #
      # EVERY one of them: every consumer's edge to metal is already `optional` and
      # gated on a `metal` feature. `--workspace` is what reaches them — it builds every
      # MEMBER as its own root, before features are ever consulted. Listing
      # only `scratchy-target-metal` left `scratchy-target-metal-compiler` (a
      # separate member since it was split out) building as a root, and it
      # depends unconditionally on `scratchy-target-metal`, so `objc2` came
      # back in through the side door.
      - name: Clippy
        run: cargo clippy --workspace --features scratchy-models/granite-3.1-8b-instruct
          --exclude scratchy-target-metal
          --exclude scratchy-target-metal-cli
          --exclude scratchy-target-metal-compiler
          --exclude scratchy-target-metal-models
          --exclude scratchy-target-metal-worker
          -- -D warnings

      # The spyre workspace, every member. `--workspace` builds scratchy-target-spyre's
      # flex-rs path dep, whose build script links the FFI archives (libflex_shim.a +
      # libsenlib_oco.a) from SENLIB_STATIC_LIB_DIR. The runner has no archives, so skip
      # emitting the link directives — check/clippy don't link. This is the escape hatch
      # that build script documents for exactly this case.
      #
      # One model, not `scratchy-models/all`: spyre's models crate bakes a card bundle for
      # every selected config, and an arch whose ops have no spyre lowering fails the build
      # AT THE FIRST SUCH OP, by name — the law working, and the error is the worklist. The
      # one-model scope stays for bake time and RAM (every selected config's full
      # expansion), per the CLAUDE.md rule: never build `model/all` to test one thing.
      # Every arch's forward is linted by the macOS job; granite is the one the card builds
      # use.
      - name: Clippy (spyre workspace)
        working-directory: targets/spyre
        env:
          SCRATCHY_SKIP_SENDNN_CXX: "1"
        run: cargo clippy --workspace --features scratchy-models/granite-3.1-8b-instruct -- -D warnings

      # The same model under its fp8 preset (`fp8-dynamic-per-channel`): the weights
      # struct's typed handles must cover an fp8 linear too, or every fp8 build panics
      # at expansion. One model, the expansion only.
      - name: Check the fp8 preset expands
        working-directory: targets/spyre
        run: cargo check -p scratchy-target-spyre-models --features scratchy-models/granite-3.1-8b-instruct,scratchy-quantizations/fp8-dynamic-per-channel

      # e_otel.rs, which needs `otel` and runs on any backend, type-checked
      # and linted: the macOS e2e step builds without `otel`. Here rather than
      # on macOS, whose tests job is the longer one.
      - name: Lint the otel e2e test
        run: cargo clippy -p scratchy-e2e -p scratchy-models
          --features e2e,otel,scratchy-models/granite-3.1-8b-instruct
          --test e_otel -- -D warnings

      # The common CLI core's test targets (its unit tests), and the `spyre` binary over them,
      # type-checked and linted: no other step builds them. The core is target-neutral, so it's
      # linted here rather than on macOS, whose tests job is the longer one; `scr` (the metal
      # binary) is linted there.
      - name: Lint the CLI core's test targets
        run: cargo clippy -p scratchy-cli --features claude,model/granite-3.1-8b-instruct
          --all-targets -- -D warnings
      - name: Lint the spyre binary's targets
        working-directory: targets/spyre
        run: cargo clippy -p scratchy-target-spyre-cli --features claude,model/granite-3.1-8b-instruct
          --all-targets -- -D warnings

      # The multi-node control plane, the rank rendezvous and the channel
      # that carries `ControlMessage` to followers, is plain TCP + serde: no
      # backend, no hardware. Featureless, these are the same crate builds the
      # bench steps use.
      - name: Multi-node control plane tests (no backend feature)
        run: cargo test -p scratchy-serving-transport -p scratchy-serving-worker
          --lib -- tcp_store multinode

      # The scheduler is backend-neutral — its tests need no hardware, and no
      # other step runs them (deps of `-p` test steps don't run transitively,
      # and the workspace clippy is lib+bins only). Includes the multi-wave
      # chunked-prefill contract: a prompt longer than one budget must come
      # back as full-slice continuation waves, which the spyre worker's
      # batched-prefill gate keys on.
      - name: Scheduler tests (backend-neutral)
        run: cargo test -p scratchy-serving-scheduler --lib

      # The GDN state-slot allocator is plain Rust: no backend, no GPU, and no other step runs its
      # unit tests. The engine's (its memory-budget arithmetic) run in the guided-decoding step
      # below, whose feature only adds code.
      - name: Slot-allocator unit tests (no backend feature)
        run: cargo test -p scratchy-forward-compiler --lib

      # The `--workspace` clippy above has no `--all-targets`: it builds
      # lib+bins only, so every `#[cfg(test)]` block in the workspace is
      # invisible to it and no job anywhere compiles them. These three steps
      # close that for the one crate whose tests need no hardware at all.
      #
      # `--all-targets` can't simply be added to the workspace clippy: it would
      # also build ktir-emulator's two known-broken examples (bench,
      # ktir_diff_run) — the pre-existing MTL3->MTL4 gap documented at the KTIR
      # steps in macos-metal-tests, which is why those use `--lib --tests`.
      # Hence a `-p`-scoped step instead.
      #
      # No backend feature, deliberately. scratchy-bench is `default = []` with
      # `metal` as a pure pass-through to scratchy-serving-api and no
      # backend cfg of its own, so the one feature that changes what compiles
      # is `datasets` (the parquet RAG subcommands), and neither side of it
      # needs a GPU. Each side has code only it compiles: featureless, the arm
      # that answers those subcommands with a rebuild hint; `datasets`, the
      # arrow/parquet readers. Nothing else enables `datasets`, so a lint of
      # one side is blind to the other — and the readers are exactly what an
      # arrow or parquet bump can break (they hand parquet's record batches to
      # arrow's JSON writer, which only type-checks when both resolve to the
      # same arrow). Hence a lint of each. The tests run under `datasets`: no
      # test is featureless-only, so
      # that is a superset, adding the parquet-to-query tests to the whole
      # executable coverage of the startup harness's process handling —
      # process groups, kill(-pgid), wait4/ECHILD — which is kernel/libc
      # semantics with no GPU in it.
      #
      # No `--locked`: the featureless resolution differs from the committed
      # Cargo.lock (cargo adds cblas-sys 0.1.4 alongside 0.3.0), and no other
      # step here uses it either. That staleness is a separate fix.
      - name: Clippy (bench test targets)
        run: cargo clippy -p scratchy-bench --all-targets -- -D warnings

      - name: Clippy (bench test targets, parquet datasets)
        run: cargo clippy -p scratchy-bench --all-targets --features datasets -- -D warnings

      - name: Bench harness tests (no backend feature)
        run: cargo test -p scratchy-bench --features datasets

      # Nothing else enables scratchy-core-common's `otel` feature, so no
      # other step compiles the OpenTelemetry export. Its OTLP exporter,
      # tracer provider and tracing layer only type-check when every
      # OpenTelemetry crate resolves to one version, which is exactly what a
      # bump of one of them breaks. `otel` only adds code, so this lint and
      # test run is a superset of the featureless ones. No backend feature:
      # telemetry has no GPU in it.
      - name: Clippy (OpenTelemetry export)
        run: cargo clippy -p scratchy-core-common --all-targets --features otel -- -D warnings

      - name: OpenTelemetry export tests
        run: cargo test -p scratchy-core-common --features otel

      # The grammar guide behind structured output (JSON schema, regex, EBNF,
      # structural tags) is linted above, since scratchy-e2e turns
      # `guided-decoding` on by default, but that clippy has no
      # `--all-targets`: its tests never compile, and no step runs them. They
      # are what an llguidance bump breaks without breaking the build: a
      # release changes which tokens a grammar allows, not the API. No backend
      # feature: the guide masks token ids on the CPU, and the tests build
      # their tokenizer inline. `guided-decoding` only adds code, so this is a
      # superset of the featureless run. scratchy-core-model rides along: its
      # tests and test targets need no hardware either, and no other step
      # compiles them.
      - name: Clippy (guided-decoding test targets)
        run: cargo clippy -p scratchy-serving-engine -p scratchy-core-model --all-targets
          --features scratchy-serving-engine/guided-decoding -- -D warnings

      - name: Guided-decoding grammar tests
        run: cargo test -p scratchy-serving-engine -p scratchy-core-model
          --features scratchy-serving-engine/guided-decoding

      # The serving layer's unit tests with `guided-decoding`, as every `scr serve` build has it:
      # its tests of a grammar the server builds, such as `tool_choice: "required"`'s (#765), run
      # it through that guide. The macOS serving-layer step builds without the feature, so it
      # compiles those tests out. No backend feature, as above.
      - name: Serving-layer unit tests (guided-decoding)
        run: cargo test -p scratchy-serving-api --features serve,guided-decoding --lib

  # ---------------------------------------------------------------------------
  # Whether this run needs the macOS jobs. A PR whose every changed file is in
  # a crate no macOS job compiles (the Spyre target and its triton re-host
  # crates) skips both; a push to main always runs them. The list, and the lock
  # each macOS job ends with that keeps it true, are in
  # scripts/ci-macos-scope.sh.
  #
  # Only a successful `macos=false` skips them. GitHub counts a skipped
  # required check as passing, so their `if:` fails closed: `!cancelled()`
  # drops the implicit `success()` that would otherwise skip them whenever
  # this job fails.
  # ---------------------------------------------------------------------------
  macos-scope:
    name: macOS scope
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      # A PR checks out its merge commit, whose first parent is main: two
      # commits of history are the PR's whole diff.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            scripts/ci-macos-scope.sh changed HEAD^1 HEAD >> "$GITHUB_OUTPUT"
          else
            echo macos=true >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # macOS / arm64 — Metal backend.
  #
  # `scratchy-target-metal-models` (built here at `all`) compiles the whole
  # Metal inference stack and every model. The Linux-only workspace members are linted by linux-workspace. The runner
  # has a real Apple GPU, so kernel tests run.
  #
  # macos-26 (Tahoe) is required: the metal kernels target Metal 4 and the
  # `scratchy-target-metal` build script compiles shaders against the
  # MetalPerformancePrimitives framework, which ships only in the Xcode 26 /
  # macOS 26 SDK (absent on macos-14/15).
  #
  # Two jobs, run in parallel. The whole-catalog clippy is one rustc
  # invocation over every stem (~13 min), longer than every other step
  # combined. The two share no build output: clippy writes check metadata,
  # and every `cargo test` step rebuilds the workspace in the `test` profile
  # anyway. Both are required checks in the branch rules.
  # ---------------------------------------------------------------------------
  macos-metal-clippy:
    name: macos-arm64 (metal clippy, all models)
    needs: macos-scope
    if: ${{ !cancelled() && !(needs.macos-scope.result == 'success' && needs.macos-scope.outputs.macos == 'false') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-metal-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Clippy is a superset of `cargo check`, so we run only clippy + test.
      # `turboquant` is on in every default `scr` build but not in the metal
      # models crate's own (empty) default, so name it: every model then
      # expands with the KV codec users get, and the lowering's check that a
      # TurboQuant model's tape compresses its KV runs across the whole catalog.
      # `mtp` adds the multi-token-prediction head of every model whose
      # checkpoint carries one (heads have no configs of their own). `vision`:
      # `all` selects the vision arches, whose towers need it.
      - name: Clippy
        run: cargo clippy -p scratchy-target-metal-models
          --features scratchy-models/all,scratchy-models/mtp,turboquant,vision -- -D warnings

      # The other half of macos-scope's skip: fails if this job compiled a crate
      # whose PRs skip it.
      - name: Compiled no crate macos-scope skips for
        run: scripts/ci-macos-scope.sh lock

  # The energy sampler on macOS 27, whose reader (the CLPC counters) differs from 26's. GitHub's
  # macOS 27 image is the `xcode-27` label (preview).
  power-sampler-macos-27:
    name: macos-arm64 27 (power sampler)
    needs: macos-scope
    if: ${{ !cancelled() && !(needs.macos-scope.result == 'success' && needs.macos-scope.outputs.macos == 'false') }}
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Power sampler
        run: scripts/ci-power-sampler.sh

  macos-metal-tests:
    name: macos-arm64 (metal tests)
    needs: macos-scope
    if: ${{ !cancelled() && !(needs.macos-scope.result == 'success' && needs.macos-scope.outputs.macos == 'false') }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-metal-tests
          workspaces: |
            . -> target
            targets/spyre -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `all` is model stems only, so the macos-metal-clippy job never turns
      # `hf-completions` on and its build-script path (the huggingface.co query
      # in hf_registry_build.rs) would otherwise go entirely unlinted. Scoped to
      # the smallest stem: one arch, one Hub query. Runners have network; a Hub
      # outage degrades to an empty registry rather than failing the build.
      - name: Clippy (hf-completions)
        run: cargo clippy -p scratchy-models --features smollm2-135m,hf-completions -- -D warnings

      # A dependency's integration tests don't run transitively: test the crate
      # that holds the GPU kernel suite (~155 tests: qmm/qmv/softmax/attention/rope/moe vs CPU
      # reference). The macos-26 runner has a real Apple GPU, so these execute.
      - name: Kernel tests
        run: cargo test -p scratchy-target-metal

      # KTIR (Spyre IR) test suites: the emulator's dialect/interpreter/Metal-
      # backend unit + integration tests, and the optimizer's IR->IR pass
      # tests (fusion, tile-coalesce, head-rewrite, flash-attn). Both crates'
      # tests were silently rotted (888 compile errors) behind an MTL3->MTL4
      # migration that never updated them; this locks them back into CI so
      # that can't happen again. `--features metal` runs the real
      # Metal-4-backed emulator tests (nax/amx/simdgroup matmul vs oracle) on
      # this runner's GPU, not just the CPU interpreter path.
      # `--lib --tests` (not a plain `cargo test`): ktir-emulator's two
      # examples (bench, ktir_diff_run) still call the deleted textual MLIR
      # parser and a couple of now-pub(crate) executor entry points — a
      # pre-existing gap from the MTL3->MTL4 migration, out of scope for this
      # lockdown (fixing it means either resurrecting the parser or widening
      # the executor's public surface, both real design calls). Excluding
      # them from `cargo test` here does not skip any test coverage.
      - name: KTIR emulator tests
        working-directory: targets/spyre
        run: cargo test -p ktir-emulator --features metal --lib --tests

      - name: KTIR optimizer tests
        working-directory: targets/spyre
        run: cargo test -p ktir-optimizer

      # The Metal matrix's energy sampler on macOS 26; power-sampler-macos-27 runs it on 27.
      - name: Power sampler
        run: scripts/ci-power-sampler.sh

      # Variant-selection gates (#202). These decide WHICH compiled model
      # variant claims a checkpoint, and both halves fail OPEN — a broken
      # pattern matcher or a dropped per-layer row rejects nothing, so the
      # symptom is a silent mis-load, not a red test. Nothing else in CI
      # reaches them: the workspace clippy has no `--all-targets`, and a
      # dependency's tests do not run transitively (see the kernel tests
      # above). scratchy-layers holds the runtime half
      # (`affine_pattern_matches`, `affine_widths_agree_in`) and needs no
      # features.
      - name: Variant-selection gate tests (scratchy-layers)
        run: cargo test -p scratchy-layers --lib

      # Metal's emitter (the per-model and per-arch emission the shared pipeline calls through
      # `TargetEmitter`) and its lowering: its unit tests, and the pipeline driven through it on
      # checked-in models (the presets metal lowers, a complete qwen3 emission). The shared
      # pipeline's own lib runs in the spyre job. Then its test targets at -D warnings, which no
      # other step lints.
      - name: Metal compiler tests
        run: cargo test -p scratchy-target-metal-compiler
      - name: Clippy (metal compiler, tests)
        run: cargo clippy -p scratchy-target-metal-compiler --tests -- -D warnings

      # Type-check the metal models crate's INTEGRATION tests (`tests/*.rs`). Nothing
      # else does: every clippy step is `--lib`-shaped and the `cargo test`
      # steps above are `--lib` too, so these files only ever compile on a
      # developer's machine. They call `try_load` / the metal allocator
      # directly, so they rot the moment either surface changes — this PR had
      # to repair two of them after `try_load` gained a typed result, and CI
      # would not have noticed.
      #
      # Deliberately a NARROW model scope, not `all` (every config's expansion
      # and bake). These three stems compile carrier_parity, metal_o2_logits
      # and qwen3_py_parity (`qwen3-0.6b` compiles the model it runs: without
      # it the file rotted unbuilt).
      - name: Model-crate integration tests type-check
        run: cargo clippy -p scratchy-target-metal-models --tests
          --features scratchy-models/qwen3.5-35b-a3b,scratchy-models/qwen3.6-35b-a3b,scratchy-models/qwen3-0.6b -- -D warnings

      # Serving-layer unit tests: tool-call parsers (Hermes / Llama / Kimi /
      # Mistral / Jamba / Granite / Gemma-4), chat-template rendering, the
      # Anthropic `/v1/messages` translation. Pure logic, no GPU and no real
      # model at runtime; the metal models crate's tests run beside them, and its
      # build panics on an empty model scope, so name the smallest one.
      #
      # `serve` is required, not optional: without it `anthropic` and `server`
      # are not compiled, so their tests cannot run.
      # `--test tape_hashes`: each baked model's resolved tape held to its pinned hash
      # (crates/targets/metal/models/tape_hashes.txt), at this step's scope and on its build.
      - name: Serving-layer unit tests
        run: cargo test -p scratchy-serving-api -p scratchy-target-metal-models
          --features serve,scratchy-models/smollm2-135m --lib --test tape_hashes

      # The quarantined per-tool-spans path (#193) is off by default, so
      # nothing above compiles it. Type-check it and run its gated tests so it
      # cannot rot. Cheap: same deps as the step above, one extra cfg.
      - name: Serving-layer unit tests (tool-spans quarantine)
        run: cargo test -p scratchy-serving-api -p scratchy-target-metal-models
          --features serve,tool-spans,scratchy-models/smollm2-135m --lib

      # The metal e2e tests boot a server on a real model, so they need a Metal 4
      # GPU. This runner's paravirtual GPU has none, so each test would return
      # early (`skip_if_no_gpu!`) and pass without running. What CI can check
      # here is that the files compile and lint clean; run them on a real GPU.
      # `--tests` type-checks every e2e test target, and, since `-p
      # scratchy-target-metal-models` is what names the model, that crate's own
      # lib and integration tests at that model. e_otel.rs and the CLI core's test
      # targets are linted in the linux-workspace job. `--keep-going` reports
      # every failing test target, not just those in flight at the first failure.
      - name: Lint the metal e2e tests
        run: cargo clippy -p scratchy-e2e -p scratchy-target-metal-models
          --features e2e,metal,scratchy-models/smollm2-135m
          --tests --keep-going -- -D warnings

      # `scr`, the metal binary over the common CLI core, with every core command compiled in
      # (`claude` pulls `serve`), linted with its test targets; then its manifest test
      # (`arch_feature_passthrough`: no hand-forwarded model-scope feature creeps back).
      - name: Lint and test scr
        run: |
          cargo clippy -p scratchy-target-metal-cli --features claude,model/smollm2-135m --all-targets -- -D warnings
          cargo test -p scratchy-target-metal-cli --features model/smollm2-135m --test arch_feature_passthrough

      # See the clippy job's last step.
      - name: Compiled no crate macos-scope skips for
        run: scripts/ci-macos-scope.sh lock

  # ---------------------------------------------------------------------------
  # Linux / amd64 — Spyre emulator, non-Accelerate BLAS backends.
  #
  # ktir-emulator's `blis`/`mkl`/`openblas` features (the real IBM Spyre
  # deployment's BLAS choices, run on Linux) are otherwise never built or
  # tested anywhere: linux-workspace only compiles ktir-emulator with default
  # (no-BLAS) features, and on the macOS jobs its `[target.'cfg(target_os =
  # "macos")'.dependencies.blas-src]` block is unconditional (always
  # Accelerate) — selecting `openblas`/`mkl` there collides with it. This job
  # is the only place a non-Accelerate BLAS backend actually links and runs.
  #
  # `openblas-system` (dynamic link against the distro's libopenblas via
  # pkg-config) rather than building OpenBLAS from source: minutes faster and
  # doesn't need gfortran. `blis`/`mkl` aren't covered here yet — from-source
  # BLIS already fails to build locally on aarch64 (a separate, pre-existing
  # issue) and MKL needs a heavier Intel install; revisit if Spyre deploys
  # actually depend on either.
  # ---------------------------------------------------------------------------
  linux-spyre-emu:
    name: linux-amd64 (spyre-emu blas)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/spyre
    steps:
      - uses: actions/checkout@v7
      # 2026-11-11: a Canonical/Azure DNS outage (actions/runner-images#15297)
      # left every *.ubuntu.com mirror unresolvable for ~3h — including the
      # archive/security fallbacks the runner image already lists in
      # /etc/apt/apt-mirrors.txt. The list's failover works, but not inside one
      # DNS zone: append a mirror outside ubuntu.com (kernel.org) as the last
      # resort.
      - name: Install OpenBLAS
        run: |
          printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:4\n' \
            | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          sudo apt-get $APT_OPTS update -qq
          sudo apt-get $APT_OPTS install -y -qq --no-install-recommends libopenblas-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-spyre-emu
          workspaces: targets/spyre -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (openblas-system)
        run: cargo clippy -p ktir-emulator --no-default-features --features optimizer,openblas-system -- -D warnings
      - name: Test (openblas-system)
        run: cargo test -p ktir-emulator --no-default-features --features optimizer,openblas-system --lib --tests

  # ⭐ THE TRITON SPLICE'S OWN GATE. The splice is now the ONLY producer for the
  # spliced op kinds (unconditional in `lower_one_node`), so every job that builds
  # the spyre target compiles it — this job remains the one that runs the splice's
  # OWN tests at `-D warnings`: the splice golden
  # (`tests/triton_splice_golden.rs`, which lowers every registered op through
  # the splice and pins each row's op name, attention mask slot, and the
  # emulator numeric checks) plus the spyre-emu-gated execution tests.
  # `--lib --tests`, not bare `cargo test`: the crate's two
  # `examples/` need `spyre-hw` (a card host), same exclusion the macOS job
  # documents for ktir-emulator.
  # Ubuntu (not macOS): `spyre-emu` pulls openblas, which the distro provides; the
  # macOS build would collide with Accelerate in the same way the linux-spyre-emu
  # job documents.
  #
  # The re-hosted triton crates (frontend, ktir, ktir-superdsc, numeric, splice)
  # are pure Rust — no hardware — but the linux-workspace job's clippy has
  # no `--all-targets`, so nothing else in CI compiled their tests or examples:
  # the 141 ktir tests, the stale-golden pins PROVENANCE.md leans on, and the
  # splice's own cache-probe example were all local-only until this step. A
  # bare `cargo test` is right here (their examples need no card, unlike the
  # spyre target's), so the examples' compile errors are caught too.
  linux-spyre-triton:
    name: linux-amd64 (spyre triton splice)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: targets/spyre
    steps:
      - uses: actions/checkout@v7
      # Same mirror hardening as linux-spyre-emu (the BLAS job's comment).
      - name: Install OpenBLAS
        run: |
          printf 'http://mirrors.edge.kernel.org/ubuntu/\tpriority:4\n' \
            | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          sudo apt-get $APT_OPTS update -qq
          sudo apt-get $APT_OPTS install -y -qq --no-install-recommends libopenblas-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-spyre-triton
          workspaces: |
            . -> target
            targets/spyre -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy (spyre triton)
        run: cargo clippy -p scratchy-target-spyre --features spyre-emu --all-targets -- -D warnings
      # The card surface: what `src/lib.rs` gates on `spyre-hw` (superdsc_exec and the device
      # runtime) compiles under no other step — the one above lints `spyre-emu`, and the
      # linux-workspace clippy builds the target featureless — so it rotted between card
      # runs, and #299's E0277s reached main green (#553). Lib only: the examples need a card
      # host. Check-only, so the FFI archives are not needed (SCRATCHY_SKIP_SENDNN_CXX=1 keeps
      # the build script from emitting its static-link directives, exactly as in the
      # linux-workspace job); flex-rs, the declarations crate, is linted with it — it is an
      # in-tree path dependency, so it is a member of the spyre workspace. The worker's hw surface can't
      # join: its scratchy-models build script would need the archives.
      - name: Clippy (spyre-hw card surface)
        env:
          SCRATCHY_SKIP_SENDNN_CXX: "1"
        run: cargo clippy -p scratchy-target-spyre -p flex-rs --features scratchy-target-spyre/spyre-hw -- -D warnings
      - name: Test (spyre triton golden + emu execution)
        run: cargo test -p scratchy-target-spyre --features spyre-emu --lib --tests
      # The spyre worker's modules compile under no other CI job:
      # linux-workspace builds plain `spyre`, which carries no spyre worker
      # runtime (that needs an executor: `spyre-emu` or `spyre-hw`). So they
      # are linted and their unit tests run here, on the emu stack this job
      # already builds — including the decode-routing predicate that keeps
      # 1-token slices of unfinished prompts out of batched decode. A model
      # feature must be named (zero-model is a build-time panic); granite is
      # the one the card builds use.
      - name: Clippy (spyre worker, all targets)
        run: cargo clippy -p scratchy-target-spyre-worker -p scratchy-target-spyre-models --all-targets
          --features spyre-emu,scratchy-models/granite-3.1-8b-instruct -- -D warnings
      - name: Test (spyre worker unit tests)
        run: cargo test -p scratchy-target-spyre-worker -p scratchy-target-spyre-models
          --features spyre-emu,scratchy-models/granite-3.1-8b-instruct --lib
      # The same modules at -D warnings, all targets: no other step lints them, so lint debt
      # piled up unseen (#616's 9 errors). llama-3.2-1b is the smallest model whose bundles bake
      # clean here.
      - name: Clippy (spyre worker, emulator)
        run: cargo clippy -p scratchy-target-spyre-worker -p scratchy-target-spyre-models
          --features spyre-emu,scratchy-models/llama-3.2-1b --all-targets -- -D warnings
      # The spyre-side ktir-superdsc and spyre-bundle crates' TEST targets compile
      # under no other CI step: this job's clippy above is -p scratchy-target-spyre,
      # the triton clippy below is the five re-host crates, and the linux-workspace job's
      # workspace clippy has no --all-targets, so workspace members' test builds
      # never happen there. #714's dangling `Df::Fp8` sat in exactly that gap (the
      # import deleted with MatmulStaging, the usage left in
      # zz_a_one_row_matmul_fills_every_core.rs) — main could not compile that test
      # binary and no check was red. This leg is the compile cover for that class.
      # The same gap at clippy: the test step below compiles ktir-superdsc's test
      # targets, but no step LINTS them (the triton clippy is the five re-host
      # crates, the workspace clippy has no --all-targets), so lint debt piled
      # unseen — main was red in this leg nobody ran (chain_stage_program's
      # nine positional args, an identity op in the broadcast-prefix-row test).
      - name: Clippy (spyre ktir-superdsc, all targets)
        run: cargo clippy -p ktir-superdsc --all-targets -- -D warnings
      - name: Test (spyre ktir-superdsc + bundle)
        run: cargo test -p ktir-superdsc -p scratchy-spyre-bundle
      # scratchy-subtile's lib and integration tests ran in no step, so they rotted unseen (#542:
      # a missing initializer field kept the lib tests from compiling). Pure Rust, no device.
      - name: Test (scratchy-subtile)
        working-directory: .
        run: cargo test -p scratchy-subtile
      # The test targets of spyre-bundle and subtile at -D warnings: `cargo test` compiles
      # them but never lints them, so lint debt piles up in them unseen.
      - name: Clippy (spyre-bundle, tests)
        run: cargo clippy -p scratchy-spyre-bundle --tests -- -D warnings
      - name: Clippy (scratchy-subtile, tests)
        working-directory: .
        run: cargo clippy -p scratchy-subtile --tests -- -D warnings
      # The compile-time half of the variant-selection gates (#202): the per-(stem, preset) width
      # resolution and the row collection/compression feeding it, the quant-config parser under
      # it, the config loader, the codegen and frontend suites, and `head_ladder_tests` (the check
      # the models' build runs that an MTP head reaches its target's top rung, #600) — the WHOLE
      # lib, under the target of every shared default (`target::Shared`). Its loader tests name the
      # build scope they load under (`config::Scope`), so none selects zero configs and passes
      # having checked nothing. Then its test targets at -D warnings, which no other step lints.
      - name: Forward-compiler macro tests
        working-directory: .
        run: |
          cargo test -p scratchy-forward-compiler-macro --lib
          cargo clippy -p scratchy-forward-compiler-macro --tests -- -D warnings
      # Spyre's bake (the per-model emission the pipeline calls through `TargetEmitter`), and its
      # pinned derivations on the checked-in configs.
      - name: Spyre compiler tests
        run: |
          cargo test -p scratchy-target-spyre-compiler --features spyre-emu --lib
          cargo clippy -p scratchy-target-spyre-compiler --features spyre-emu --tests -- -D warnings
      - name: Clippy (triton re-host crates, all targets)
        run: cargo clippy -p triton-frontend -p triton-ktir -p triton-ktir-superdsc -p triton-numeric -p scratchy-triton-splice --all-targets -- -D warnings
      - name: Test (triton re-host crates)
        run: cargo test -p triton-frontend -p triton-ktir -p triton-ktir-superdsc -p triton-numeric -p scratchy-triton-splice

  # ---------------------------------------------------------------------------
  # ⭐ THE CARD'S LOWERING, WITHOUT A CARD. `spyre-lower` lowers every rung a card build bakes — the
  # decode ceiling and its batch rungs, every prefill width to 512, the prefix and CB rungs — through
  # the card's own path (`ktir_groups_via_superdsc`, `render_dxp_input`, `launch_index`) and every
  # refusal on the way, and compiles no device image. Before it, a lowering defect only the card path
  # reaches (#1162's fold: an aliasing time-tiled write at 8b fp8's prefill m=384) was invisible to
  # every CI job and surfaced on the card. That fold FAILS this step; main passes it.
  #
  # One model per job: a lowering holds 8.5–9.8 GiB at peak (measured on the four granites), over
  # half a standard runner's 16 GB. ~2 min each on a warm 144-core host; a cold runner is CPU-bound.
  # Check-only, so the SDK's C++ shim is skipped as in the linux-workspace job.
  # ---------------------------------------------------------------------------
  linux-spyre-lower:
    name: linux-amd64 (spyre-lower ${{ matrix.model.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        model:
          - { name: granite-3.1-2b fp16, features: "scratchy-models/granite-3.1-2b-instruct" }
          - { name: granite-3.1-2b fp8, features: "scratchy-models/granite-3.1-2b-instruct,scratchy-quantizations/fp8-dynamic-per-channel" }
          - { name: granite-3.1-8b fp16, features: "scratchy-models/granite-3.1-8b-instruct" }
          - { name: granite-3.1-8b fp8, features: "scratchy-models/granite-3.1-8b-instruct,scratchy-quantizations/fp8-dynamic-per-channel" }
    env:
      SCRATCHY_SKIP_SENDNN_CXX: "1"
    defaults:
      run:
        working-directory: targets/spyre
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-spyre-lower
          workspaces: targets/spyre -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lower every card rung (no device compile)
        run: cargo check -p scratchy-target-spyre-models --features spyre-lower,${{ matrix.model.features }}

  # ---------------------------------------------------------------------------
  # compile_fail doctest ERROR CODES, checked on nightly rustdoc.
  #
  # A ```compile_fail,E0277 doctest is a proof that rustc rejects a bad shape for
  # THAT reason. Stable rustdoc ignores the pinned code: any compile error passes,
  # so a typo or an unrelated breakage in the doctest satisfies it. Only nightly
  # rustdoc checks the code ("Some expected error codes were not found").
  #
  # Covers every crate with a `compile_fail,E` doctest
  # (`git grep -l 'compile_fail,E' -- crates targets`):
  #   scratchy-tensors       src/typed.rs
  #   scratchy-target-metal  src/tape/typed.rs  (objc2 ⇒ macOS runner)
  #   scratchy-target-spyre  src/runtime.rs     (gated on `spyre-hw`)
  # ktir-core's former E0080 wrong-copy fixture is deleted: it asserted a
  # `31` it declared inside itself, which proves only that `assert!` fails
  # in const context. ktir-core stays on the line below — it has no
  # doctests left, so the run is a no-op for it and covers the rest.
  # `spyre-hw` pulls flex-rs, whose FFI archives are absent on this runner;
  # the link directives are skipped as in the check-only jobs. Nothing links
  # them: the crate's only runnable doctests are these compile_fail ones.
  #
  # Its own job (not a step in another): a second toolchain step would change the
  # default toolchain for every later step there. Not gated on macos-scope: that
  # gate skips spyre/tensors-only PRs, whose pins this job also checks.
  # ---------------------------------------------------------------------------
  nightly-compile-fail-codes:
    name: macos-arm64 (nightly compile_fail error codes)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-compile-fail-codes
          workspaces: |
            . -> target
            targets/spyre -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Doctests (compile_fail error codes)
        run: cargo +nightly test --doc -p scratchy-tensors -p scratchy-target-metal
      - name: Doctests (compile_fail error codes, spyre workspace)
        working-directory: targets/spyre
        env:
          SCRATCHY_SKIP_SENDNN_CXX: "1"
        run: cargo +nightly test --doc -p ktir-core -p scratchy-target-spyre --features scratchy-target-spyre/spyre-hw

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      # site/ and targets/spyre are their own workspaces, so the root --all above never
      # reaches them.
      - run: cargo fmt --manifest-path site/Cargo.toml --all -- --check
      - run: cargo fmt --manifest-path targets/spyre/Cargo.toml --all -- --check

  scripts:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Standard library only (scripts/cc_trace.py and its tests): no install step.
      - run: python3 -m unittest discover -s scripts/tests -v

name: Pages

# Main never builds the site; the site branch's pages.yml does. This only asks it to rebuild
# when main's docs or DSLs change. It must stay at this path: a dispatch finds its workflow by
# the file on main.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'crates/models/arch/dsl/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-site:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref site

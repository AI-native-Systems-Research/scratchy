name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Forks don't have Pages enabled, so configure-pages would fail there.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      # The site crate is its own workspace, so the repo-wide gates in
      # rust.yml never see it: lint and test it here.
      - name: Lint and test the site renderer
        run: |
          cargo clippy --manifest-path site/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path site/Cargo.toml

      - name: Build site
        run: cargo run --release --manifest-path site/Cargo.toml

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

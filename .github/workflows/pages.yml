name: Pages

# Main never builds or deploys the site. The site and its data live on the site branch, whose own
# pages.yml builds and deploys it. Main only asks for a rebuild when what the site renders from main
# changes (docs, CONTRIBUTING.md, the DSLs), so the live pages stay current.
#
# This file must stay at this path on main: a workflow_dispatch finds its workflow by the file on
# the default branch, then runs the dispatched branch's copy. Main's rebuild request and the metal
# round bot both dispatch pages.yml that way.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'crates/models/arch/dsl/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Start the site branch's Pages run, which builds main's head with the site branch and deploys.
  rebuild-site:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref site

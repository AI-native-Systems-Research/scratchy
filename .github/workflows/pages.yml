name: Pages

# Main's runs of the site build (site-build.yml, which states the build once). The site and its data
# live on the site branch, which runs the same build from its own pages.yml; main runs it when what
# the site renders from main changes.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'crates/models/arch/dsl/**'
      - '.github/workflows/pages.yml'
      - '.github/workflows/site-build.yml'
  # Every pull request to main builds the site against the site branch's head and checks its links
  # without deploying: the site renders files from all over main (docs/, the DSLs), so any change
  # can break it.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, shared with the site branch's Pages runs; let an in-flight run finish rather
# than cancelling it. Anything but main (a pull request, or a dispatch elsewhere) only builds, in a
# group of its own superseded by its next run, so it never queues behind or cancels a deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' || github.event_name == 'pull_request' }}

jobs:
  site:
    uses: ./.github/workflows/site-build.yml
    with:
      main_ref: ${{ github.sha }}
      site_ref: site
      deploy: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}

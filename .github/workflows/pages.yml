name: Pages

# The only workflow that deploys the site. It runs main's site build (site-build.yml on main, which
# states the build once): it checks out main at the root and this branch at site/, lints, tests,
# renders, and deploys. It runs on a push to this branch, and main starts it (a workflow_dispatch on
# this branch) when what the site renders from main changes.
on:
  push:
    branches: [site]
  # A pull request to this branch (a data PR, a page change) builds the site and checks its links
  # without deploying.
  pull_request:
    branches: [site]
  # Started on this branch by main's pages.yml, which deploys; and on a metal round's branch by its
  # bot (metal-round.yml on main), which only builds: only this branch deploys.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it. Anything but this branch (a pull request, or a dispatch on a metal round's branch)
# only builds, in a group of its own superseded by its next run, so it never queues behind or
# cancels a deploy.
concurrency:
  group: ${{ github.ref == 'refs/heads/site' && github.event_name != 'pull_request' && 'pages' || format('pages-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/site' || github.event_name == 'pull_request' }}

jobs:
  site:
    uses: AI-native-Systems-Research/scratchy/.github/workflows/site-build.yml@main
    with:
      main_ref: main
      site_ref: ${{ github.sha }}
      deploy: ${{ github.ref == 'refs/heads/site' && github.event_name != 'pull_request' }}

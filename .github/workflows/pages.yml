name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/pages.yml'
  # Every pull request builds the site and checks its links without deploying: the site renders
  # files from all over the repo (docs/, the DSLs, site data), so any change can break it.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-flight run finish rather than cancelling it. A pull request's
# build is its own group, superseded by its next push.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Forks don't have Pages enabled, so configure-pages would fail there.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: site

      # The site crate is its own workspace, so the repo-wide gates in
      # rust.yml never see it: lint and test it here.
      - name: Lint and test the site renderer
        run: |
          cargo clippy --manifest-path site/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path site/Cargo.toml

      - name: Build site
        run: cargo run --release --manifest-path site/Cargo.toml

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

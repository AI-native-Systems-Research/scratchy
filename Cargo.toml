[package]
name = "scratchy-site"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Renders the GitHub Pages site into _site at build time."

# The site branch's own workspace, never a member of main's: it is checked out
# at site/ in a main checkout and built by main's .github/workflows/site-build.yml
# (called from each branch's .github/workflows/pages.yml), so main's
# workspace-wide clippy gates never compile a web framework.
[workspace]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "0.7"
flate2 = "1"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

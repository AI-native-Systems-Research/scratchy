[package]
name = "scratchy-triton-splice"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The splice: a SubtileTape node whose KTIR comes from a Triton kernel
# (crates/triton/PROVENANCE.md), compiled at `#[forward]` expansion time. A LEAF
# between the two ladders: scratchy-subtile (the tape types) below, the re-hosted
# Triton front end above. scratchy-target-spyre routes every spliced op kind
# through it unconditionally — the target crate gains a hook, not a second copy of
# the lowering.

[dependencies]
scratchy-subtile = { path = "../../compiler/subtile", features = ["spyre"] }
ktir-core = { path = "../../targets/spyre/ktir/ktir-core" }
ktir-superdsc = { path = "../../targets/spyre/ktir/ktir-superdsc" }
# ⭐ THE RUST LADDER, from this workspace's own re-host. `codegen::compile` parses `.py`
# kernels with the OWNED parser (`triton-frontend/src/py/parser.rs`), which the splice
# does at expansion time. The ladder is dependency-free offline
# (crates/triton/PROVENANCE.md, copy rule 2) — no crates.io package regardless.
triton-frontend = { path = "../triton-frontend" }
triton-ktir = { path = "../triton-ktir" }
triton-ktir-superdsc = { path = "../triton-ktir-superdsc" }

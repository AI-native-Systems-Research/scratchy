[package]
name = "scratchy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The scratchy CLI's common core: every command, its arguments and `run`, shared by each target's binary (`scr` on Apple silicon, `spyre` on IBM Spyre)"

# A library, no binary: each target's CLI crate (`crates/targets/<target>/cli`) parses its command
# line, links its target's worker and runs these commands through `scratchy_cli::run`. Nothing here
# names a target: the engine serves through the worker the binary links (`linked_factory`).
[features]
default = ["chat"]

# The in-process ENGINE (local model inference), no HTTP server: `chat`
# running a model locally. Pulls scratchy-serving-api (WITHOUT its `serve`
# feature, so no axum). A target's binary adds its worker.
chat = ["dep:scratchy-serving-api"]
# The OpenAI/Anthropic HTTP server ON TOP of the engine: `serve` (and the
# offline `batch` command). Adds axum/tower via scratchy-serving-api/serve.
# Pulls `guided-decoding` too: OpenAI's `response_format: json_schema` /
# grammar constraints are a server-side request field — `chat` never
# exposes a grammar flag, so plain `chat` builds skip the llguidance stack
# (17 crates incl. a duplicate `tokenizers` pulled by toktrie_hf_tokenizers,
# which is pinned to tokenizers 0.21 upstream while we're on 0.23).
serve = ["dep:scratchy-serving-api", "scratchy-serving-api/serve", "guided-decoding"]
# `launch claude` spawns `<this binary> serve` as a child, so it needs the
# server compiled in.
claude = ["serve"]

otel = ["scratchy-serving-api?/otel"]
bench = ["scratchy-bench"]
# The bench dataset loaders that read parquet (2WikiMQA, HotpotQA, MS MARCO), for `bench
# serve --dataset-name rag --rag-source two-wiki|hotpotqa`.
bench-datasets = ["bench", "scratchy-bench/datasets"]
# Server-side modifiers: no-op without `serve` (`?/` only forwards when
# scratchy-serving-api is present). `guided-decoding` is pulled in by `serve`
# above; enable it explicitly (e.g. `--features chat,guided-decoding`) to
# build grammar support into a non-`serve` binary.
guided-decoding = ["scratchy-serving-api?/guided-decoding"]
# Gates the real image-decode stack: scratchy-serving-api/multimodal makes
# its `scratchy-vision`/`image` deps optional-and-on and forwards
# `scratchy-forward-compiler/vision`, so a plain `chat` build (no
# `multimodal`) never compiles image/png/zune-jpeg/etc.
multimodal = ["scratchy-serving-api?/multimodal"]
tls = ["scratchy-serving-api?/tls"]
metrics = ["scratchy-serving-api?/metrics"]
# EXPERIMENTAL, off by default, and deliberately not a `serve` flag: see
# the feature's own comment in crates/serving/api/Cargo.toml.
tool-spans = ["scratchy-serving-api?/tool-spans"]
rag = ["scratchy-serving-api?/rag"]

[lib]
name = "scratchy_cli"
path = "src/lib.rs"

[dependencies]
scratchy-core-common = { workspace = true }
scratchy-core-config = { workspace = true }
scratchy-serving-api = { workspace = true, optional = true }
scratchy-core-model = { workspace = true }
# The compiled variants' dumps (`BackboneDumpRegistration`), which `model info` and its stem
# completion walk.
scratchy-forward-compiler = { path = "../../compiler" }
# The model scope's compiled HF registry (`compiled_hf_registry()`), which `model names`
# completes from. A target's binary turns it on (`features = ["model"]`).
model = { package = "scratchy-models", path = "../../models/arch", optional = true, default-features = false }
scratchy-bench = { workspace = true, optional = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
uuid = { version = "1", features = ["v4"] }
libc = { workspace = true }
# ureq, not reqwest: see src/http.rs. Not optional — `chat --url`
# and `complete` are always built, and ureq is already in the tree via
# hf-hub-downloader, so they cost no additional crates.
ureq = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

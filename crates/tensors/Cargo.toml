[package]
name = "scratchy-tensors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Backend-neutral GPU tensor core for scratchy: GpuTensor descriptor, DType, the DeviceAllocator transfer trait, and GGML quant metadata. No backend — every backend sits on top of this."
# The target-neutrality guard reads this repository's whole tree (`../..`): it runs here, not
# from a published package.
exclude = ["tests/cfg_neutrality.rs"]

[features]

[dependencies]
anyhow = { workspace = true }
# For DeviceAllocator::register_mmap's signature (a target's zero-copy alias path
# registers the safetensors mmap; the trait's default impl ignores it). Pure-CPU, no backend.
memmap2 = { workspace = true }
# A dim's number as a type (`typed::Dim::Num`), a law between dims a bound on those numbers.
typenum = { workspace = true }
# `Serialize` on the law-carrying facts (`rotary_facts`), so a target's static tape builds one
# through its checked `const fn try_new`.
serde = { workspace = true }

[dev-dependencies]
# The manifest guard in tests/cfg_neutrality.rs reads `cargo metadata`'s JSON.
serde_json = { workspace = true }

[package]
name = "scratchy-forward-compiler-macro"
version.workspace = true
edition.workspace = true
license.workspace = true

# A normal lib (not a proc-macro): the forward pipeline
# (`parse_python_file` + `compile_carrier`) is driven directly from
# the consolidated `scratchy-models` build.rs — there is no attribute macro.
[features]
# The target is not a feature here: the build that compiles the models hands `compile_carrier`
# its emitter (`target::TargetEmitter`). `metal` remains while metal's emission still lives in
# this crate's codegen.
default = []
# Turns on `scratchy-ir/metal` so the metal-only
# `Instruction` variants (`SynthGateUpSiluMul`, `AffineEmbed`) are
# visible to the macro's match arms — they're gated
# `#[cfg(feature = "metal")]` in `scratchy-ir`.
metal = ["scratchy-ir/metal",
    "scratchy-forward-compiler-frontend/metal",
    "dep:scratchy-target-metal",
    "dep:scratchy-target-metal-compiler",
]
# TurboQuant KV compression, fixed per model at build time. Read only under
# `metal`, the one backend with the codec's kernels: every model whose geometry
# the codec takes (`scratchy_layers::turboquant::codec_for`) is emitted
# with `KV_CODEC = TurboQuant`, the rest stay dense and are named in the build
# output. Nothing selects it at runtime. `scratchy-cli` turns it on by default.
turboquant = []
# The real-config fixtures (`fixtures`: an arch's configs, one `(stem, preset)` variant, its program
# and fused graph through the real passes), for a target compiler's tests.
test-support = ["scratchy-forward-compiler-frontend/test-support"]

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# The model facts (`scratchy_ir::model_facts`) the fill builds on every target.
scratchy-ir = { path = "../ir" }
scratchy-tensors = { path = "../../tensors" }
# PD-wavefront (task T2b): the subtile-wavefront IR + lowering +
# scheduler + host tape player live in this normal (Mac-testable) lib
# crate. `to_wavefront.rs` here translates the solved FUF + `Assignment`
# into a `scratchy_subtile::LoweringInput` and calls `lower()`. The
# proc-macro crate can't export the IR types, so they live in a normal
# crate it calls.
scratchy-subtile = { path = "../subtile" }
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
serde_json = { workspace = true }
rayon = { workspace = true }
# `Implementation::fan_out` returns
# `Vec<Instruction>` typed at proc-macro time, killing the
# `OpInstance::field_values: Vec<TokenStream>` round-trip. The
# proc-macro needs the `Instruction` enum in scope to construct
# values. scratchy-forward-compiler defines `Instruction` (cross-backend
# already in this branch); we depend on it here so the enum is in
# scope. scratchy-forward-compiler must NOT depend on scratchy-forward-compiler-macro
# back (the re-export of the proc-macro was dropped to break the cycle).
scratchy-forward-compiler = { path = ".." }
# The front end (parser, classifier, dims, config rules, weights manifest, typed-Rust emit pass): its
# own crate so the build script below and this crate share one compile of it.
scratchy-forward-compiler-frontend = { path = "../frontend" }

# Backend-specific dependencies (enabled by features)
scratchy-target-metal = { path = "../../targets/metal", optional = true }
# Metal's own compile-time lowering, on the TARGET side of the dependency edge — this
# crate depends on it, never the reverse, which is what let the lowering leave
# `compiler/macros` at all.
scratchy-target-metal-compiler = { path = "../../targets/metal/compiler", optional = true }

# The build script runs the front end's typed-Rust emit pass (`build.rs`) over the carriers: the same
# front-end crate this crate depends on, the same host build of it.
[build-dependencies]
scratchy-forward-compiler-frontend = { path = "../frontend" }
serde_json = { workspace = true }

# The front end's test fixtures, for this crate's tests.
[dev-dependencies]
scratchy-forward-compiler-frontend = { path = "../frontend", features = ["test-support"] }

[package]
name = "deeptools"
version.workspace = true
edition.workspace = true
license.workspace = true

# ⛔⛔ NO SCRATCHY DEPENDENCY, EVER.
#
# This crate holds the deeptools IRs and the bridges between them. It knows nothing about
# scratchy's tape: anything that speaks `TensorRegion` or `SubtileNode` belongs on the scratchy
# side of bridge 1, not here. A dependency edge back into scratchy is what turns a bridge into a
# recovery — build a lowering, throw the shape away, then try to read it back out.
[dependencies]

# THE ARCHITECTURE SPEC — the ISA field/opcode tables, the register-file depths, the unit enumerators.
#
# ⭐ ITS OWN CRATE BECAUSE BOTH SIDES INCLUDE IT. In the C++ the compiler and the senulator each
# `#include` `sys-arch-spec/`'s headers; in Rust that has to be a crate or each side keeps a copy and
# the copies drift. They did: `Isa::InstOperand` was 89 enumerators in each, and that they were in the
# SAME ORDER was provable only by a hand-written assertion.
#
# ⛔⛔ `default-features = false`, AND IT IS LOAD-BEARING. `sys-arch-spec`'s `default` turns on
# `arch-rcudd1a`, and cargo UNIONS features across a graph — so one edge that takes the default pins
# the whole build to the RCUDD1A field tables and `--features arch-sen1p5` becomes a flag that changes
# nothing. Each edge must forward the choice instead of making it.
sys-arch-spec = { path = "sys-arch-spec", default-features = false }

# ⛔ THE `.ddl` TEXT IS PARSED HERE AND NOWHERE ELSE. `build.rs` turns `ddl_templates/*.ddl` into
# const tables, because parsing text is the one thing in this crate that cannot be a constant. The
# parser lives in `ddl/`, OUTSIDE `src/`, so its `String`s cannot reach the emitter.
[build-dependencies]

# ⛔⛔ THE ISA IS A BUILD INPUT BECAUSE `.smc` RIGHT-HAND SIDES ARE CLASSIFIED AGAINST IT.
# `SMCLineToInstrInfo` types a field as a VARIABLE unless the value is a name the ISA gives THAT field
# (`sys-arch-spec/dpc/dpc.cpp:811-849`), and `x1` is both — an `unroll` literal and a register
# `exx2_32.ddl` declares — so a value-only test resolves `unroll=x1` to a register address. Doing the
# lookup here means the emitted table already says which of the two each slot is.
#
# ⛔ `default-features = false` FOR THE SAME REASON AS THE `[dependencies]` EDGE, and the arch feature
# forwards to BOTH kinds: `sys-arch-spec/arch-rcudd1a` names the dependency, not one of its uses.
sys-arch-spec = { path = "sys-arch-spec", default-features = false }

[features]
# ⛔ THE TARGET ARCH IS A FEATURE, NOT AN ENV VAR, AND NOT A RUNTIME VALUE. Which `.ddl` template
# serves an op-func depends on the ISA (`opFuncToDdlTemplate` tags `bmm.ddl` RCUDD1A and
# `bmm_sen1p5.ddl` SEN1P5), and so do the PT row count, the L0 capacity and the HBM segment count.
# For a crate that runs inside a proc macro that is a COMPILE-TIME fact, and a feature is the
# mechanism cargo already has for it: `Target` resolves to one arch, so `Target::PT_ROWS` is a
# literal the compiler folds rather than a field anything reads.
#
# ⛔ EXACTLY ONE, ENFORCED. Naming both or neither is a build failure in `arch.rs`, not a silent
# precedence rule — two arches at once is a compiler built for one machine against the tables of
# another.
default = ["arch-rcudd1a"]
# `RCUDD1A_ISA`, IBM's own `DEFAULT_ISA` (`isa.hpp:30`). 8 PT rows, a 64-stick L0, 8 HBM segments.
# ⛔ SELECTING AN ISA HERE SELECTS THE SAME ONE IN THE SPEC. The field tables and register-file depths
# are `sys-arch-spec`'s and are cfg'd on this feature, so a build that turned it on for only one of
# the two crates would compile a compiler for one machine against the tables of another.
arch-rcudd1a = ["sys-arch-spec/arch-rcudd1a"]
# `SEN1P5_ISA`. 4 PT rows, a 128-stick L0 with a 16-stick scale region, 32 HBM segments, cores
# tethered in pairs.
arch-sen1p5 = ["sys-arch-spec/arch-sen1p5"]

[lib]

[package]
name = "scratchy-decoder-state"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published: the root CI step `cargo publish --workspace --dry-run --no-verify` would otherwise package it.
publish = false

# What a decoder state hands the compiler, as one handle (`DecoderState`), and how the carriers are typed
# (`Typing`): the build that compiles the models states both, and the forward compiler reads them.
[dependencies]
# The vocabulary trait a decoder state declares its DSL ops and state inputs under.
scratchy-forward-compiler-frontend = { path = "../frontend" }
# The shapes a carrier's typed program records (`Typing::traced`).
scratchy-typed-shapes = { workspace = true }
# The facts a decoder state's ops carry into the subtile IR (`DecoderState::subtile`).
scratchy-subtile = { path = "../subtile" }

[package]
name = "scratchy-subtile"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

[features]
default = []


[dependencies]
# `RowsExtern` — which host-staged buffer a `LoadRows` reads — is one type across every IR: the
# `Instruction`, this crate's `SubOp`, the metal step. scratchy-ir never reaches back here.
scratchy-ir = { path = "../ir" }
# The tensor-parallel world as a type: `tensor_parallel::shard` is generic over it, and the spyre
# collective protocol names the same type.
scratchy-tp-world = { path = "../../core/tp-world" }
scratchy-tensors = { path = "../../tensors" }
# `half::f16` for the HOST REFERENCE's fp16-island round trips (the sampler's
# Gumbel draw rounds through IEEE binary16 at each f16 boundary — eval_dag is
# the bake-time numeric gate's own reference, non-test code).
half = { workspace = true }

[build-dependencies]
# The build script reads every model `config.json` in the workspace and writes the head geometries
# they declare out as literal tokens (see `build.rs::emit_config_geometry`). Same parser the macro's
# config loader uses, one compilation earlier — which is the only place a const generic for a
# model's geometry can be monomorphised, since the lowering runs inside the macro's expansion.
serde_json = { workspace = true }

[dev-dependencies]
# `cpu_golden` is the host calculator the VALIDATION tests compute with
# (test-only — no non-test code references scratchy-forward-compiler). It
# lives in dev-dependencies so this crate's normal graph has NO edge to
# scratchy-forward-compiler: that lets `scratchy-forward-compiler` depend on
# this crate (the GPU subtile Executor lives in its metal interpreter and
# consumes `metal_tape`) without a cycle. Cargo permits the dev-only
# back-edge. scratchy-forward-compiler builds backend-agnostic here (no
# metal feature), so the tests stay host-runnable on any platform.
scratchy-forward-compiler = { path = ".." }
# `tests/value_door_ratchet.rs` parses the compiler, tensor, layer, target and triton crates'
# source to count #1094's remaining law asserts and value→type doors. The versions are the
# macro crate's, so the test adds no crate to the lock.
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"

# The `sdsc_abstract` proof harnesses live with that module in `ktir-superdsc`
# (crates/targets/spyre/ktir/ktir-superdsc) and run there: `KANI_PKG=ktir-superdsc`.
#
# The proof harnesses here compile only under the model checker, so `cfg(kani)` is a real name a normal
# build never defines. DECLARED rather than silenced: an undeclared cfg is how ~100 commits of "the proofs
# hold" turned out to be vacuous — a normal build skipped the module and said nothing — and declaring it
# keeps a typo in the name an error while stopping the lint complaining about the name itself.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

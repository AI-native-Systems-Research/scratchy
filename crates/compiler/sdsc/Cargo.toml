[package]
name = "scratchy-sdsc"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]

# The staged SDSC lowering IRs (`SubtileIR → MacroIR → … → SDSC wire`). Each IR is its own type with
# its own host `eval`; each bridge is a ≤3-fan-out pass verified at build time by
# `eval(IR_{n+1}) == eval_dag` (anchored on `scratchy-subtile`'s SubtileIR interpreter).

[dependencies]
# The anchor: SubtileIR + its golden host interpreter `eval_dag` (the proven reference KTIR + SenGraph
# both match). `spyre` is required for `sdsc_abstract` (the device address model `dev_off`/`AbsMem` that
# DeviceIR's eval runs over) — it is `#[cfg(feature="spyre")]` in subtile. scratchy-sdsc IS the spyre/SDSC
# lowering, so it always wants this; cargo unifies it with the macro's own `scratchy-subtile/spyre`.
scratchy-subtile = { path = "../subtile", features = ["spyre", "superdsc"] }
# The SDSC LOWERING moved to the spyre target crate (M3); this crate
# checks its output, so it follows the code.
scratchy-target-spyre = { path = "../../targets/spyre", default-features = false }

# The proof harnesses here compile only under the model checker, so `cfg(kani)` is a real name a normal
# build never defines. DECLARED rather than silenced: an undeclared cfg is how ~100 commits of "the proofs
# hold" turned out to be vacuous — a normal build skipped the module and said nothing — so declaring it
# keeps a typo in the name an error while stopping the lint complaining about the name itself.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

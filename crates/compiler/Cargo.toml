[package]
name = "scratchy-forward-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Multimodal/vision capability: pulls `scratchy-vision` and surfaces the MM
# arch registry (`ScratchyMmRegistration` / `try_load_mm` / `resolve_mm_metadata`)
# + `MultimodalForward`. A CAPABILITY gate, not a target one.
vision = ["dep:scratchy-vision"]

# Pulls in the Hub downloader, `safetensors`, `clap` etc for the
# `probe-weights` binary — these are only needed when somebody
# runs the prober, so they're gated off by default to keep the
# ordinary library build fast.
probe = ["dep:hf-hub-downloader", "dep:clap", "dep:ureq", "dep:serde"]

# Target-neutral: the model-facts trait, the shared registry row and walk, the head registry. No
# target feature and no target dependency — each target crate depends on this one and extends it.
[dependencies]
# Backend-neutral tensor core.
scratchy-tensors = { path = "../tensors" }
# The cfg-free `Instruction` enum + `WeightAccessors` trait live here so
# the forward pipeline and every target share one neutral definition.
scratchy-ir = { path = "ir" }
# Backend-neutral weight-store container (`weights::GpuWeights<A>`) named by the
# cross-arch load registry (`arch_registry`). The registry's generic `try_load`
# is monomorphized over the concrete `GpuWeights<A>` at the worker call site;
# the fn-pointers themselves stay allocator-erased via
# `scratchy_tensors::GpuWeightsHandle`. Acyclic — scratchy-layers deps only
# tensors + quantizations + core-model, none of which dep this crate.
scratchy-layers = { path = "../layers" }
# `scratchy-vision` (backend-neutral vision host glue) supplies
# `MmMetadata` for the dispatcher's `ScratchyMmRegistration`. Optional and
# pulled in by the `vision` feature; the crate itself is backend-dep-free.
scratchy-vision = { path = "../models/vision", optional = true }
anyhow = { workspace = true }
inventory = { workspace = true }
# Optional deps used only by the `probe-weights` bin under the
# `probe` feature. `ureq` is a blocking HTTP client we use for
# Range-request header-only reads of safetensors (avoiding the
# multi-GB full-shard downloads a plain `get` would do).
hf-hub-downloader = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
ureq = { version = "3", optional = true, features = ["rustls"] }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }
# `half::f16` / `half::bf16` are part of the `cpu_golden::affine_dequantize_b4_*`
# public surface (Metal int4 reference path); also used by metal interpreter
# tests for f32 ↔ f16 conversion when allocating + reading back Metal buffers
# in numerical-correctness checks.

[[bin]]
name = "probe-weights"
path = "src/bin/probe_weights.rs"
required-features = ["probe"]

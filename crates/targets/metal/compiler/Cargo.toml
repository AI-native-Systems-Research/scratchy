[package]
name = "scratchy-target-metal-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Metal's compile-time lowering and emission: the target emitter the shared pipeline calls, SubtileTape -> metal step tape + static tape"

# A COMPILE-TIME crate: the build script of metal's models crate runs it, and it never links into
# the runtime — so `syn`/`quote` are fine here, which is why `WeightSlot` (whose `base` is a
# `syn::Ident`) lives here and not in `scratchy-subtile`, which the metal runtime does link.
[dependencies]
# The shared pipeline this crate's emitter plugs into (`target::TargetEmitter`), and the passes the
# emission reads (`to_wavefront`, `codegen`, `weight_bindings`, ...).
scratchy-forward-compiler-macro = { path = "../../../compiler/macros" }
scratchy-forward-compiler-frontend = { path = "../../../compiler/frontend" }
# The facts the emission states (`KvCodec`, `LentWeight`).
scratchy-forward-compiler = { path = "../../../compiler" }
scratchy-subtile = { path = "../../../compiler/subtile" }
scratchy-target-metal = { path = ".." }
scratchy-ir = { path = "../../../compiler/ir" }
# `typed::unsigned_path`: the bake states a GEMM's numbers as types. Already in the graph (through
# scratchy-target-metal).
scratchy-tensors = { path = "../../../tensors" }

syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
serde = { version = "1", features = ["derive"] }

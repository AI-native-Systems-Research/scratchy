[package]
edition = "2024"
rust-version = "1.94"
name = "ktir-emulator"
version = "0.1.0"
build = "build.rs"
exclude = ["tests/fixtures/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "KTIR execution layer — the Spyre emulator: ktdp interpreter, machine-state model, and Metal/NAX/AMX accelerator backend (RFC 0682)."
readme = false
license = "Apache-2.0"
repository = "https://github.com/torch-spyre/ktir-cpu"

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]
default-target = "aarch64-apple-darwin"

[features]
blis = [
    "dep:cblas-sys",
    "dep:blas-src",
    "blas-src/blis",
]
default = ["optimizer"]
metal = [
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-foundation",
]
mkl = [
    "dep:cblas-sys",
    "dep:blas-src",
    "blas-src/intel-mkl-dynamic-sequential",
]
openblas = [
    "dep:cblas-sys",
    "dep:blas-src",
    "blas-src/openblas",
]
openblas-system = [
    "openblas",
    "dep:openblas-src",
    "openblas-src/system",
]
optimizer = ["dep:ktir-optimizer"]

[lib]
name = "ktir_emulator"
path = "src/lib.rs"

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "ktir_diff_run"
path = "examples/ktir_diff_run.rs"

[[example]]

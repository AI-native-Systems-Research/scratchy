path = "../ktir-core"

[dependencies.ktir-optimizer]
version = "0.1.0"
path = "../ktir-optimizer"
optional = true

[dependencies.objc2]
version = "0.6"
optional = true

[dependencies.objc2-foundation]
version = "0.3"

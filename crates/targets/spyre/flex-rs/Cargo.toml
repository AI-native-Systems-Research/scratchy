[package]
name = "flex-rs"
version = "0.1.0"
edition = "2024"
description = "Native Rust port of the flex::allocator / flex::runtime_stream slice reachable from scratchy's Spyre SDK ABI shim."

[lib]
name = "flex_rs"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
libc = "0.2"

[build-dependencies]
cc = "1"

[lints.rust]
# `cfg(kani)` gates the proof harnesses in src/scheduler/kani_proofs.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

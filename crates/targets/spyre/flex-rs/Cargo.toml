[package]
name = "flex-rs"
version = "0.1.0"
edition = "2024"
description = "Native Rust port of the flex::allocator / flex::runtime_stream slice reachable from scratchy's Spyre SDK ABI shim."

[lib]
name = "flex_rs"
path = "src/lib.rs"

[dependencies]
tracing = "0.1"
libc = "0.2"

# `sched_{get,set}affinity` without `unsafe`, for `numa`'s thread placement. Already in the
# lockfile (tempfile's and xattr's); only its `thread` API is added.
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = ["std", "thread"] }

[lints.rust]
# `cfg(kani)` gates the proof harnesses in src/scheduler/kani_proofs.rs.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

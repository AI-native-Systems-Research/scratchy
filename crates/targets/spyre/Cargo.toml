[package]
name = "scratchy-target-spyre"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "IBM Spyre (KTIR) backend for scratchy: host allocator + KTIR target. No GPU toolchain."

[features]
# THE BUILD'S ONE TENSOR-PARALLEL WORLD (`tp/N` from the CLI): the world crate's `Build` is
# `TpWorld<N>`, and everything that instantiates a world at the top names `Build`.
tp-2 = ["ktir-superdsc/tp-2"]
tp-4 = ["ktir-superdsc/tp-4"]
tp-8 = ["ktir-superdsc/tp-8"]
# THE CARD: link the IBM Spyre runtime so a bundle runs on the AIU. No GPU toolchain; the SDK is
# only present/linked on a Spyre host. Pulls in `scratchy-subtile` because the session setters take
# its `sdsc_abstract` law types (mask stride / fold pages / mask blocks / int stride) rather than
# u64s, and owns the `flex-rs` dependency — flex-rs's build.rs cc-compiles its senlib shim, which
# only exists on a Spyre host, so flex-rs must NOT be pulled into a metal/emit-only build.
# `runtime`, the only module that touches flex-rs, is gated on this same feature.
#
# THE FEATURE TIERS. Cargo features are ADDITIVE, so a device is chosen by naming it, never by
# turning something off. One hidden tier carries the shared facts; the two a user names are SIBLINGS.
#
#   spyre        — hidden. Everything target-neutral: the IR types, the lowering, the bundle.
#   spyre-hw     — a card, ANY revision. This is what every `cfg` in the tree gates the SDK on.
#                  There is exactly one revision today (`flex-rs/cxx-shim` ships `senlib/1p0` and
#                  nothing else) and it does NOT get a feature of its own: a per-revision name
#                  (`spyre-sen1p0`) gated no `cfg` anywhere, so it bought nothing and cost a forked
#                  card tier in four manifests. A second revision lands as one more user-facing
#                  feature ON TOP of this one, and still changes no `cfg`.
#   spyre-emu    — the emulator. NOT "spyre without hardware": its own device, its own memory, its
#                  own f16 encoding, its own launch. Neither sibling implies the other, and neither
#                  is a fallback for the other.
spyre = []
#   spyre-lower  — the card's LOWERING with no device compile: every rung the card bakes, through
#                  `render_dxp_input` and `launch_index` and every refusal on the way, and no device
#                  image (`superdsc_bake::global()` is `None`). What a card bake lowers is decided here;
#                  `spyre-hw` adds only the compiler that turns it into images, and the SDK.
spyre-lower = ["spyre"]
# The card surface's flex-rs edge: the in-tree crate carries the C-ABI
# DECLARATIONS only — the implementation is linked statically, as two
# archives built on card hosts from the internal trees
# (libflex_shim.a, an extern "C" seam over the native Rust port, then
# libsenlib_oco.a), from the directory SENLIB_STATIC_LIB_DIR names.
# A public clone compiles with no internal artifact present; a spyre-hw
# BUILD without the archives refuses loudly at the build script,
# naming what is missing. No feature of the real crate needs naming
# here; the declarations are generation-free.
spyre-hw = ["spyre-lower", "dep:flex-rs"]
spyre-emu = ["spyre", "dep:ktir-emulator"]
# ⭐ THE TRITON SPLICE IS THE ONLY PRODUCER — UNCONDITIONAL. `lower_one_node` routes
# every spliced op kind (`MatmulTile`, `Elementwise`, `SiluMul`, `RmsNorm`,
# `RopeRotate`/`RopeAppend`, `ScalarMul`) through `scratchy_triton_splice::lower`;
# there is no builder arm behind it, so the dependency cannot be optional. The old
# "pod must keep a path without the parser" concern is retired by the owned parser
# (3088ede28): the whole ladder is dependency-free offline
# (`crates/targets/spyre/triton/PROVENANCE.md`, copy rule 2).

[dependencies]
# ⭐ THE BAKED BUNDLE ITSELF — re-exported from this crate's root as `bundle_code`, which is the path
# the `#[forward]` macro's `inventory::submit!` tokens name. UNCONDITIONAL and feature-free on
# purpose: those tokens land in the arch crate under `spyre`, which does NOT turn on this crate's
# `spyre-hw`, so a gate here would make them fail to resolve in a build that has the target but not
# the card runtime.
scratchy-spyre-bundle = { path = "bundle" }
# ⭐ THE TRITON SPLICE — the registry + ladder driver that compiles a Triton kernel
# for a SubtileNode. UNCONDITIONAL (see [features]): it is the only producer for the
# spliced op kinds, and the ladder is dependency-free offline.
scratchy-triton-splice = { path = "triton/splice" }
# The registry constants a spliced program reads (`layout::registry_constants`) — the bundle
# registry holds them (`bundle_registry`); the splice already depends on it.
triton-ktir-superdsc = { path = "triton/triton-ktir-superdsc" }
scratchy-tensors = { path = "../../tensors" }
# `kill(-pid, SIGKILL)` on a `dxp_standalone` process group — see `superdsc_bake`'s worker pool.
libc = { workspace = true }
# Neutral leaf crate (NOT a `targets/` crate) — holds the shared `GpuWeights`
# container the spyre `__gpu` facade re-exports for the macro's load path.
scratchy-layers = { path = "../../layers" }
# Neutral leaf — the affine/nvfp4 quant layer TYPES the macro's `Weights` struct
# names (`AffineQuantEmbedding`, `AffineQuantLinear`, `Nvfp4Linear`).
scratchy-quantizations = { path = "../../models/quantization" }
half = { workspace = true }
# The weight store's mmap backing — the alias path's keepalive (`HostBytes::View`
# holds the `Arc<Mmap>` the bytes are viewed through). Same workspace version
# `scratchy-tensors` already exposes through `DeviceAllocator::register_mmap`.
memmap2 = { workspace = true }
# In-tree crate: the senlib flex port's PUBLIC face — the C-ABI
# declarations and the pure-Rust type layer (addressing, control-block
# words, scheduler) the card surface compiles against. The implementing
# archives are linked statically at build (see flex-rs/build.rs), so
# this builds on any host and links the real implementation only where
# the archives exist.
flex-rs = { path = "flex-rs", optional = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# The persistent dxp cache's content keys (`dxp_cache`) — the version the workspace already builds.
sha2 = "0.11"
# `graph_wiring` lowers the unrolled graph's nodes in parallel.
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The KTIR emulator (RFC 0682) — Spyre's hardware-free execution path, only pulled by `spyre-emu`.
# (Repo is still named `ktir-cpu`; the crate it publishes was renamed `ktir-cpu` -> `ktir-emulator`.)
# VENDORED IN-TREE, not fetched: the lowering constructs ktir-core's `Operation`/`IRFunction` and
# `#[forward]` bakes them as const data, so the IR types must be a path dependency. `ktir-core` is
# dependency-free and unconditional; the emulator is a DEVICE, and only its own build links it.
ktir-core = { path = "ktir/ktir-core" }
# ⭐⭐⭐ THE KTIR->SUPERDSC LOWERING, AS A SCRATCHY-FREE LEAF. The destination of the extraction: a
# crate a third-party KTIR producer (IBM, `triton-spyre`) can consume without pulling scratchy in.
# This edge is the dependency inversion arriving early -- the moment any moved module is named by a
# path OTHER than a `scratchy-subtile` re-export, this crate must name it directly. Feature-free and
# unconditional, like `ktir-core`: the lowering is not a device.
ktir-superdsc = { path = "ktir/ktir-superdsc" }
# No `metal` feature forced here: the emulator's build.rs enables its Metal/NAX
# backend automatically on macOS (`cfg(metal)` from `CARGO_CFG_TARGET_OS`), so the
# feature would only ever force `objc2` (Apple-only) onto a Linux build — which
# cannot compile it. macOS keeps the backend; Linux falls back to the naive
# sgemm parity oracle in the emulator's `blas.rs`.
ktir-emulator = { path = "ktir/ktir-emulator", optional = true }
# The sdsc session laws (`sdsc_abstract`): `PrefixMaskShape` / `FoldPages` /
# `MaskBlocks` / `FoldRowRegime` — the only mints for the values the card's
# session setters accept. Optional: only the `spyre-hw` run path binds a session.
scratchy-subtile = { path = "../../compiler/subtile", features = ["spyre"] }
# The model facts (`scratchy_ir::model_facts`) the bake threads through the lowering.
scratchy-ir = { path = "../../compiler/ir" }

# The tests mint the pool's law-governed quantities (head widths, slot and
# page counts, gather scratches) through the same `sdsc_abstract` doors
# production uses, so a fixture cannot encode a relationship production can't.
[dev-dependencies]
scratchy-subtile = { path = "../../compiler/subtile", features = ["spyre"] }
# The allocator tests' read-only file mappings — the store's own backing kind.
tempfile = { workspace = true }
# A fixture states one program's LX scope (`LxScope::for_test`) without a lowering door.
ktir-superdsc = { path = "ktir/ktir-superdsc", features = ["test-support"] }
# The model facts (`scratchy_ir::model_facts`) the bake threads through the lowering.
scratchy-ir = { path = "../../compiler/ir" }
# EXAMPLES ONLY. `bundle_run_dev` installs a subscriber so flex's completion thread has somewhere to
# write its CB-error lines — the `hmi_syndrome` / `qgi_syndrome` / `job_count` that say why a launch was
# rejected. Without one, a rejected launch is a bare `sync rc=-1`.
tracing-subscriber = { workspace = true }

# ⛔⛔⛔ DECLARED, BECAUSE `--all-targets` BUILDS AN EXAMPLE AND THE DEFAULT BUILD HAS NO
# `bundle_run` TO BUILD IT AGAINST. `bundle_run_dev.rs` calls
# `scratchy_target_spyre::bundle_run::run`, and `bundle_run` is `#[cfg(feature = "spyre-hw")]`
# (lib.rs:27), so cargo's auto-discovered example is compiled at DEFAULT features and fails:
#
#   error[E0433]: cannot find `bundle_run` in `scratchy_target_spyre`
#     --> crates/targets/spyre/examples/bundle_run_dev.rs:49:28
#   note: found an item that was configured out ... gated behind the `spyre-hw` feature
#
# MEASURED per TARGET, because the whole command's rc cannot see this: `cargo clippy
# -p scratchy-target-spyre --all-targets -- -D warnings` is rc 101 ON MAIN ALREADY, from 18
# pre-existing lints in test targets NO CI JOB LINTS (`doc list item without indentation`,
# `this assertion has a constant value`, `casting to the same type`, ...). What this block changes is
# the EXAMPLE target: without it, `could not compile scratchy-target-spyre (example
# "bundle_run_dev")`; with it, that target is skipped and no diagnostic names this example.
# `required-features` is the declaration that makes the example's real dependency a fact cargo knows,
# so `--all-targets` SKIPS it off-card instead of failing — the same shape of defect as an ungated
# `pub mod`, one level out in the target graph where a per-crate `cargo check` never looks.
[[example]]
name = "bundle_run_dev"
required-features = ["spyre-hw"]

# #546's concurrency leg: two tracked OP_ORDERING streams, one cross-stream RAW hazard,
# one shared card — the hazard tracker's ordering demo on real hardware.
[[example]]
name = "hazard_concurrency"
required-features = ["spyre-hw"]

# #606's card leg: the shared host pool's cardless-unreachable invariants on real
# hardware — the whole-region pin (non-null IOVA), index addressing + IOVA stability,
# the pre-mapped H2D/D2H round trip through a slot, and the copyRaw validation set.
[[example]]
name = "shared_host_pool_probe"
required-features = ["spyre-hw"]

# #1016's card leg: `Stream::fill_zero` on real hardware — the vendor's fill op's
# first caller is `zero_seg`, so this proves the fill CB writes zeros on a card
# (poisoned non-zero first, all-zero after), across a window boundary.
[[example]]
name = "fill_zero_probe"
required-features = ["spyre-hw"]

# One process, N cards: an all-gather over the real flex card-to-card path, byte-exact on every card.
[[example]]
name = "cards_all_gather"
required-features = ["spyre-hw"]

# The proof harnesses in this crate compile only under the model checker, so `cfg(kani)` is a real name a
# normal build never defines. DECLARED rather than silenced: an undeclared cfg is how ~100 commits of "the
# proofs hold" turned out to be vacuous (a normal build skipped the module and said nothing), and declaring
# it keeps a typo in the cfg name an error while stopping the lint complaining about the name itself.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

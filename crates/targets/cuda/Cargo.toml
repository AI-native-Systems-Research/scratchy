[package]
name = "scratchy-target-cuda"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NVIDIA CUDA backend for scratchy: the per-opcode ABI as declared data, and the H100 kernels behind the `nvcc` feature."

# The runtime side of the CUDA target: the const ABI tables the shared passes take as input
# (`op_abi`), the step type opcode lowering produces (`step`), and, under `nvcc`, the kernels.
#
# THE FEATURE TIERS (as `spyre` / `spyre-hw` split, `crates/targets/spyre/Cargo.toml`):
#
#   (none) — toolchain-free. `build.rs` spawns nothing and links nothing, so the crate compiles
#            anywhere, with no nvcc and no GPU. This is the build CI and the Mac use.
#   nvcc   — compiles `kernels/*.cu` (ThunderKittens vendored at `kernels/thunderkittens/`) with
#            nvcc from CUDA 12.8+ on PATH for `sm_90a`, links them, and adds `kernels`, their
#            launchers and the runtime that plays a tape (`runtime`). Named for the toolchain it
#            needs, not for a GPU: it compiles on any Linux host with nvcc. Its tests (`gemm_bf16`,
#            `tape_player`) need an sm_90 GPU and fail without one. Never built in CI; the GKE
#            H100 run is its only gate.
[features]
nvcc = []

[dependencies]
# The SHARED front end and passes. CUDA lowers the same `SubtileTape` metal and spyre lower; the
# tables here are inputs to `tape_colouring`, `tape_folding` and `sample_rows`.
scratchy-subtile = { path = "../../compiler/subtile" }
# bf16 round-to-nearest-even for the rotary table the worker builds on the host (`rotary`), and
# bf16 <-> f32 for the GPU tests' inputs and outputs.
half = { workspace = true }

[dev-dependencies]
# The tape tests build their fixtures with the shared lowering types and lower them with CUDA's
# compiler, which depends on this crate: a dev-only cycle Cargo allows. The integration tests link
# one copy of this library, the one the compiler links too.
scratchy-subtile = { path = "../../compiler/subtile" }
scratchy-target-cuda-compiler = { path = "compiler" }

# The bf16 GEMM against a CPU reference, on the GPU. Not built without `nvcc`.
[[test]]
name = "gemm_bf16"
required-features = ["nvcc"]

# The row kernels (RMSNorm, add, SiluMul) against a CPU reference, on the GPU. Not built without
# `nvcc`.
[[test]]
name = "row_ops"
required-features = ["nvcc"]

# The rope, gate-split and gate-apply kernels against a CPU reference, on the GPU. Not built
# without `nvcc`.
[[test]]
name = "rope_gate"
required-features = ["nvcc"]

# The KV append and the prefill attention over the paged KV cache against a CPU reference and
# exact probes, on the GPU. Not built without `nvcc`.
[[test]]
name = "attention"
required-features = ["nvcc"]

# The hand-written tapes against what CUDA's compiler lowers. No toolchain needed.
[[test]]
name = "tape_layout"

# The tape player on the GPU: GEMM chains through the arena against a CPU reference.
[[test]]
name = "tape_player"
required-features = ["nvcc"]

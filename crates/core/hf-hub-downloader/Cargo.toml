# SPDX-License-Identifier: Apache-2.0
[package]
name = "scratchy-hf-hub-downloader"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal HuggingFace Hub downloader: parallel ranged fetch into the standard HF cache layout"

# Published as scratchy-hf-hub-downloader, so the name on crates.io carries the scratchy prefix;
# the library keeps its name, so code still says `hf_hub_downloader`.
[lib]
name = "hf_hub_downloader"

# Every dependency here is one we already compile, every one is on a
# maintained release line, and there are no dev-dependencies at all. That is
# the point of the crate: `hf-hub` 0.4.3 is
# the last of its branch and will never be updated, so staying on it pins us
# to `ureq 2` and `indicatif 0.17` forever with nobody to unstick them. We
# need eight calls out of that library; owning them costs four dependencies
# we control the upgrade cadence of.
[dependencies]
# Features come from the workspace row: rustls-no-provider, with the
# pure-Rust RustCrypto provider installed by scratchy-tls (no C toolchain).
ureq = { workspace = true }
# The TLS config both agents below take.
scratchy-tls = { workspace = true }
sha2 = "0.11"
sha1 = "0.11"
hex = "0.4"
dirs = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[package]
name = "scratchy-tp-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The tensor-parallel world as a type: `TpWorld<N>` and its ranks. No dependencies, no features."

[lib]

# ⛔ A LEAF WITH NO DEPENDENCIES. The shared sharding analysis (`scratchy-subtile`,
# every target) and the spyre collective protocol (`ktir-superdsc`, which has no scratchy
# dependency) both name the world, so it lives below both: one type, never a number handed between
# them. A target's own limits on a world (the card's sids) are that target's, stated as a trait
# over this one in its own crate.
[features]
# ⭐ THE BUILD'S ONE WORLD — `tp/N` from the CLI reaches here, and [`Build`] is `TpWorld<N>`; naming
# none is a world of one, naming two is a build error. The ONE selection: the `#[forward]` macro
# bakes for `Build` and the worker serves `Build`, so the two cannot disagree.
tp-2 = []
tp-4 = []
tp-8 = []

[dependencies]

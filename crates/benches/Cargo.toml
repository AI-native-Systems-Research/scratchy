[package]
name = "scratchy-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Benchmarking tools for vLLM Rust inference engine"

[features]
default = []
# Parquet-backed RAG accuracy datasets (hotpotqa / multihop / msmarco).
# Off by default so the parquet subtree only compiles when those three
# `scr bench` subcommands are needed.
datasets = ["dep:parquet"]

[dependencies]
scratchy-core-common = { workspace = true }
scratchy-core-config = { workspace = true }
scratchy-serving-api = { workspace = true }
scratchy-serving-engine = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
anyhow = { workspace = true }
serde_json = { workspace = true }
indicatif = { workspace = true }
# ureq, not reqwest: see src/http.rs. Same door the Hub downloader uses.
ureq = { workspace = true }
# The TLS config `agent()` builds on (pure-Rust provider, no C).
scratchy-tls = { workspace = true }
rand = { workspace = true }
# 0.5 is the line that pairs with rand 0.9; 0.4 would pin a second rand.
rand_distr = "0.5"
serde = { workspace = true }
# `getrusage` for the child's peak RSS and major-fault count. major_faults is
# what proves a FROZEN run's page-cache eviction took effect, so it gates
# validity rather than being a diagnostic.
libc = { workspace = true }
shell-words = "1"
csv = "1"
dirs = { workspace = true }
# Rows as JSON through parquet's own record reader (`json`: `Row::to_json_value`), so no arrow.
parquet = { version = "60", default-features = false, features = ["snap", "json"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
# The test fixtures write their parquet files with arrow's writer: rows the reader under test
# did not produce.
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "json"] }
arrow = { version = "60", default-features = false, features = ["json"] }

[package]
name = "scratchy-vision"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Scratchy vision-tower host glue (rope tables, varlen cu_seqlens, patch flatten, K-pad, trace dump)."

[features]
# Backend-dep-free: this crate is pure-CPU vision host glue (rope tables,
# cu_seqlens, patch flatten, VisionConfig, MmMetadata). It depends on no
# backend target; the `metal` feature is a pure source toggle (currently a
# no-op; reserved for symmetry with sibling crates).
default = []
metal = []

[dependencies]
scratchy-core-common = { path = "../../core/common" }
half = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

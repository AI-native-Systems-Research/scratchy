[package]
name = "scratchy-quantizations"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared quantization preset definitions + GGUF (llama.cpp) format support. Presets live in `presets/`; GGUF format-level code in the `gguf` module."
# `build.rs` publishes the enabled presets to every direct dependent's build script, as
# `DEP_SCRATCHY_QUANTIZATIONS_PRESETS`.
links = "scratchy-quantizations"

[features]
# Compile-time build scope for quant-preset variant synthesis (which quant
# variants of a selected model get emitted by `#[forward]`). Lives here —
# not on scratchy-models — so `crates/cli/scr/Cargo.toml` can alias this
# crate `quant` (a name distinct from `model`, which aliases scratchy-models)
# and reach `--features quant/<preset>` from the CLI build line. Cargo
# forbids aliasing the SAME crate under two different local names in one
# Cargo.toml, which is exactly why `model`/`quant` need to be two different
# crates, not two names for scratchy-models. No `quant-` text prefix on the
# feature names below, same reasoning as `<stem>` having no `model-` prefix
# on scratchy-models — the `quant` alias already carries that meaning;
# `quant/quant-fp8-dynamic-per-channel` would just stutter.
#
# Every edge to this crate is an ordinary dependency, so a `quant/<preset>`
# from a CLI and a `scratchy-quantizations/<preset>` from scratchy-models'
# own features land on ONE build of it, the build whose `build.rs` publishes
# the presets `scratchy-forwards.rs` synthesizes variants for.
awq-gemm = []
bnb-nf4-dq = []
ct-int4-sym = []
fp8-block-128x128 = []
fp8-dynamic-per-channel = []
fp8-dynamic-per-tensor = []
fp8-static-per-tensor = []
gemma4-moe-ct-int4-sym = []
ggml = []
gptq-sym = []
gptq-sym-desc_act = []
mlx-affine-b2-g64-attn4-router8-qembed = []
mlx-affine-b2-g64-qembed = []
mlx-affine-b3-g64-attn4-router8-qembed = []
mlx-affine-b3-g64-qembed = []
mlx-affine-b4-g128 = []
mlx-affine-b4-g128-qembed = []
mlx-affine-b4-g32 = []
mlx-affine-b4-g64 = []
mlx-affine-b4-g64-mlp8-router8 = []
mlx-affine-b4-g64-qembed = []
nvfp4 = []

# Shorthand for "every MLX affine (int4) preset" — the dominant (in
# practice, only) quant use case on a Mac, but still opt-in (`quant/mlx`),
# not a default: a selected quant preset REPLACES a model's dense/bf16
# emission rather than adding to it (see `arch_has_active_quant` in
# crates/compiler/macros/src/config.rs), so defaulting any preset on would
# silently kill dense on every build. NOT nvfp4: despite config.rs's
# quant filter allowing it through, it panics codegen today
# (`UnsupportedWeight`, "non-affine int4/ggml weight not yet lowered on the
# SDSC/wavefront path") — not ready to bundle in.
mlx = [
    "mlx-affine-b2-g64-attn4-router8-qembed",
    "mlx-affine-b2-g64-qembed",
    "mlx-affine-b3-g64-attn4-router8-qembed",
    "mlx-affine-b3-g64-qembed",
    "mlx-affine-b4-g32",
    "mlx-affine-b4-g64",
    "mlx-affine-b4-g64-qembed",
    "mlx-affine-b4-g64-mlp8-router8",
    "mlx-affine-b4-g128",
    "mlx-affine-b4-g128-qembed",
]

[dependencies]
scratchy-core-model = { path = "../../core/model" }
scratchy-tensors = { path = "../../tensors" }
anyhow = { workspace = true }
half = { workspace = true }
rayon = { workspace = true }
byteorder = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tokenizers = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

# Quant presets are NOT declared on this crate — they live on
# scratchy-quantizations (crates/models/quantization/Cargo.toml), so
# `crates/cli/scr/Cargo.toml` can alias that crate `quant` (distinct from
# this crate's `model` alias — Cargo forbids aliasing the SAME crate under
# two names, which is exactly why quant scope needed its own crate).
# `scratchy-forwards.rs` (this crate's build script) calls
# `scratchy_quantizations::enabled_presets()` — via the [build-dependencies]
# edge below — to compute SCRATCHY_QUANTS, intersected per-arch against that
# arch's own quantizations.json (an arch that doesn't declare a preset just
# ignores it).

# Backends — ONE definition each (this is what kills the per-arch duplication).
# The build-dep pipeline lib gets the backend so its emit matches; the runtime
# compiler + target crates get it so the emitted code compiles; quant defaults
# ride the backend.
cuda = [
    "scratchy-forward-compiler-macro/cuda",
    "scratchy-forward-compiler/cuda",
    "scratchy-target-cuda/cuda",
    "scratchy-vision?/cuda",
]
metal = [
    "scratchy-forward-compiler-macro/metal",
    "scratchy-forward-compiler/metal",
    "dep:scratchy-target-metal",
    "scratchy-vision?/metal",
]
nccl = [
    "cuda",
    "scratchy-forward-compiler-macro/nccl",
    "scratchy-forward-compiler/nccl",
    "scratchy-target-cuda/nccl",
    "scratchy-vision?/nccl",
]
spyre = [
    "scratchy-forward-compiler-macro/spyre",
    "scratchy-forward-compiler/spyre",
    "dep:scratchy-target-spyre",
]
# SuperDSC emit path — the bundle that owns the 32-core split instead of the
# sengraph. A cargo feature, NOT an env var: `cfg!(feature="superdsc")` in codegen.
superdsc = [
    "spyre",
    "scratchy-forward-compiler-macro/superdsc",
    "scratchy-forward-compiler/superdsc",
]
[dependencies]
scratchy-layers = { path = "../../layers" }
scratchy-quantizations = { path = "../quantization" }
scratchy-forward-compiler = { path = "../../compiler" }
scratchy-target-cuda = { path = "../../targets/cuda", optional = true }
scratchy-target-metal = { path = "../../targets/metal", optional = true }
scratchy-target-spyre = { path = "../../targets/spyre", optional = true }
scratchy-vision = { path = "../vision", optional = true }
half = { workspace = true, optional = true }
anyhow = { workspace = true }

# scratchy-forwards.rs drives the #[forward] pipeline for every enabled arch (no attribute
# macro). The backend feature is forwarded onto this build-dep above.
[build-dependencies]
scratchy-forward-compiler-macro = { path = "../../compiler/macros" }
# Same crate as the regular dependency above, ALSO as a build-dependency:
# scratchy-forwards.rs calls `scratchy_quantizations::enabled_presets()` to
# read quant scope (see the `[features]` comment near the removed
# `quant-<preset>` block above — quant scope moved off this crate so it can
# get its own `quant` CLI alias, distinct from `model`).
scratchy-quantizations = { path = "../quantization" }
# `syn` parses the DSL carrier (`dsl/<arch>.rs.in`). It is NOT used to render
# the emit — `render_lines` walks the token stream directly, so the emitted file
# never round-trips through an AST (see scratchy-forwards.rs for the numbers).
syn = { version = "2", features = ["full", "parsing"] }
proc-macro2 = "1"
serde_json = { workspace = true }
# Emit arches in parallel (scratchy-forwards.rs), nested with the pipeline's own
# per-model rayon fan-out.
rayon = { workspace = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2-metal = { version = "0.3", features = ["MTLDevice"] }

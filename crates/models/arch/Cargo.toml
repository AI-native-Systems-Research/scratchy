[package]
name = "scratchy-models"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Model architectures — one crate; scratchy-forwards.rs drives the #[forward] pipeline per arch"
# Named build script (not build.rs) so the process shows as
# `build-script-scratchy-forwards` instead of the opaque `build-script-build`.
build = "scratchy-forwards.rs"

[features]
# Deliberately empty. Every model + quant preset is fully opt-in — no
# default scope to accidentally widen or need `--no-default-features` to
# narrow. `scratchy-forwards.rs` panics at build time if zero model features
# end up selected (see `total_models_emitted` in
# crates/compiler/macros/src/config.rs), so a build naming no models fails
# loudly instead of silently linking a binary with none. Name at least one,
# e.g. `--features metal,llama-3.2-3b`, or a wider `--features metal,llama`
# (bare arch name = every config in that arch) / `--features metal,all`.
default = []

# Per-arch gates. `arch-<name>` compiles that arch's `pub mod <name>` and tells
# the build script to emit it. Vision arches also pull their shared text decoder + the
# vision host crate. (The build script scans dsl/*.rs.in.)
arch-commandr = []
arch-deepseek-v2 = []
arch-deepseek-v3 = []
arch-deepseek-v3-flat = []
arch-gemma2 = []
arch-gemma3 = []
arch-gemma3-mm = ["arch-gemma3", "dep:scratchy-vision", "dep:half", "scratchy-forward-compiler/vision", "scratchy-target-metal?/vision"]
arch-gemma4 = []
arch-gemma4-moe = []
arch-granite = []
arch-llama = []
arch-locateanything = ["arch-qwen2", "dep:scratchy-vision", "dep:half", "scratchy-forward-compiler/vision", "scratchy-target-metal?/vision"]
arch-mistral = []
arch-mixtral = []
arch-modernbert = []
arch-phi3 = []
arch-qwen2 = []
arch-qwen2-5-vl = ["arch-qwen2", "dep:scratchy-vision", "dep:half", "scratchy-forward-compiler/vision", "scratchy-target-metal?/vision"]
arch-qwen2-moe = []
arch-qwen2-vl = ["arch-qwen2", "dep:scratchy-vision", "dep:half", "scratchy-forward-compiler/vision", "scratchy-target-metal?/vision"]
arch-qwen3 = []
arch-qwen3-5 = []
arch-qwen3-5-moe = []
arch-qwen3-5-vl = ["arch-qwen3-5", "dep:scratchy-vision", "dep:half", "scratchy-forward-compiler/vision", "scratchy-target-metal?/vision"]
arch-qwen3-moe = []

all-arches = [
    "arch-commandr",
    "arch-deepseek-v2",
    "arch-deepseek-v3",
    "arch-deepseek-v3-flat",
    "arch-gemma2",
    "arch-gemma3",
    "arch-gemma3-mm",
    "arch-gemma4",
    "arch-gemma4-moe",
    "arch-granite",
    "arch-llama",
    "arch-locateanything",
    "arch-mistral",
    "arch-mixtral",
    "arch-modernbert",
    "arch-phi3",
    "arch-qwen2",
    "arch-qwen2-5-vl",
    "arch-qwen2-moe",
    "arch-qwen2-vl",
    "arch-qwen3",
    "arch-qwen3-5",
    "arch-qwen3-5-moe",
    "arch-qwen3-5-vl",
    "arch-qwen3-moe",
]

# Per-model gates. Every checked-in `configs/<arch>/<stem>.json` gets its
# own feature named `<stem>` — no `model-` text prefix: `crates/cli/scr/
# Cargo.toml` depends on this crate under the local rename `model = {
# package = "scratchy-models", ... }`, so Cargo's `pkg/feature` CLI syntax
# already reads as `--features model/granite-3.1-2b-instruct` — the alias
# carries the "this is a model" meaning, a redundant text prefix on the
# feature name itself would just be typed twice.
#
# A HANDFUL of stems are byte-identical files checked into two arch dirs at
# once — the same checkpoint, loadable via a vision arch (pulls
# `dep:scratchy-vision`) or via its non-vision base arch (doesn't). Verified
# per pair, not a naming convention: the vision arch keeps the bare stem,
# the base arch's copy is suffixed `-text-only` (established codebase
# vocabulary — see e.g. crates/serving/api/src/multimodal.rs). Prefixing
# with the arch name instead (`<arch>-<stem>`) reads badly whenever the stem
# already starts with the vision arch's own name, e.g. a naive
# `qwen2-qwen2-vl-2b-mlx` for qwen2's copy of qwen2-vl's `qwen2-vl-2b-mlx`.
# Any FUTURE stem collision not already verified this way falls back to the
# plain `<arch>-<stem>` prefix (see feature_name() in the generator).
#
# The build script (via crates/compiler/macros/src/config.rs) reads the
# file, parses it, AND forward-expands it ONLY when this feature is on — an
# unselected model's JSON is never even opened. Each entry implies its
# `arch-<name>` gate, so enabling one model is enough to compile that arch's
# module.
# commandr (2 configs)
"c4ai-command-r-v01" = ["arch-commandr"]
"command-r-1-layer" = ["arch-commandr"]


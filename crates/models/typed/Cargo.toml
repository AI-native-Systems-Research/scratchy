[package]
name = "scratchy-models-typed"
version.workspace = true
edition.workspace = true
license.workspace = true
# Not published: the root CI step `cargo publish --workspace --dry-run --no-verify` would otherwise package it.
publish = false

# Every carrier under `crates/models/arch/dsl/` as typed Rust over the op signatures, compiled: a
# shape error in a carrier is a type error here. Each target's models build hands `traced` to the
# forward compiler, which reads no model file of its own.
[dependencies]
# The op signatures each emitted carrier is type-checked against.
scratchy-typed-shapes = { workspace = true }
# The state vocabulary trait `decoder_states()` lists the build's decoder states under; also the
# carrier parser, for the test that every carrier is typed.
scratchy-forward-compiler-frontend = { path = "../../compiler/frontend" }

# The build script runs the front end's typed-Rust emit pass (`build.rs`) over the carriers.
[build-dependencies]
scratchy-forward-compiler-frontend = { path = "../../compiler/frontend" }

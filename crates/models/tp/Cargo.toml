[package]
name = "scratchy-tp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tensor-parallel build scope: which sharded worlds `#[forward]` bakes alongside each selected model (`tp/<world>` from scratchy-cli)."

[features]
# A crate of its own for the same reason as scratchy-quantizations and scratchy-spec: Cargo forbids
# aliasing one crate under two names in one Cargo.toml, and `crates/cli/scr/Cargo.toml` already
# aliases scratchy-models `model`. Each feature names the world ONCE for the whole build: it bakes
# it (scratchy-models, whose build script runs the `#[forward]` expansion) and serves it
# (scratchy-target-spyre-worker, which runs every rank in one process, one card each).
#
# A world is baked only when the build names it — none by default — and a build names at most
# one (two is a build error, `scratchy-forward-compiler-macro`'s `TP_WORLD`):
# `--features spyre-hw,model/granite-3.1-2b-instruct,tp/4`.
"2" = ["scratchy-models/tp-2", "scratchy-target-spyre-worker/tp-2"]
"4" = ["scratchy-models/tp-4", "scratchy-target-spyre-worker/tp-4"]
"8" = ["scratchy-models/tp-8", "scratchy-target-spyre-worker/tp-8"]

[dependencies]
scratchy-models = { path = "../arch", default-features = false }
scratchy-target-spyre-worker = { workspace = true }

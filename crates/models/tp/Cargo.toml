[package]
name = "scratchy-tp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tensor-parallel build scope: which sharded worlds `#[forward]` bakes alongside each selected model (`tp/<world>` from scratchy-cli)."

[features]
# A crate of its own for the same reason as scratchy-quantizations and scratchy-spec: Cargo forbids
# aliasing one crate under two names in one Cargo.toml, and `crates/cli/scr/Cargo.toml` already
# aliases scratchy-models `model`. Each feature forwards to scratchy-models, whose build script runs
# the `#[forward]` expansion that bakes the world.
#
# A world is baked only when the build names it — none by default:
# `--features spyre-hw,model/granite-3.1-2b-instruct,tp/2`.
"2" = ["scratchy-models/tp-2"]

[dependencies]
scratchy-models = { path = "../arch", default-features = false }

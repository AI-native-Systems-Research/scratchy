[package]
name = "scratchy-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Speculative-decoding build scope: which drafters compile alongside the selected models (`spec/<drafter>` from scratchy-cli)."

[features]
# A crate of its own for the same reason as scratchy-quantizations: Cargo
# forbids aliasing one crate under two names in one Cargo.toml, and
# `crates/cli/scr/Cargo.toml` already aliases scratchy-models `model` and
# scratchy-quantizations `quant`. Its features forward to scratchy-models,
# whose build script compiles the drafters.
#
# `mtp`: every drafter published as a model of its own (Gemma 4's bf16 and QAT
# assistants, drafting when `--speculative-model` names one), besides the heads
# inside their targets' checkpoints and each target's default published
# drafter (Gemma 4 26B-A4B's assistant at MLX 4-bit g32), which `metal` already
# compiles —
# `--features metal,model/gemma-4-26b-a4b-it,spec/mtp`.
mtp = ["scratchy-models/mtp"]

[dependencies]
scratchy-models = { path = "../arch", default-features = false }

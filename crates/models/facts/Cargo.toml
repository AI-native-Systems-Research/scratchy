[package]
name = "scratchy-model-facts"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Stage 1 of the two-stage model build: one type per selected canonical implementing ModelFacts, so the lowerings scratchy-models' build script runs are generic over a model's facts as compile-time constants."

[features]
# ⭐ EXACTLY scratchy-models' feature names, each forwarded from there one-for-one
# (`F = [..., "scratchy-model-facts/F"]`). The front end selects arches, models, heads and backends
# from its build script's `CARGO_FEATURE_*` env, so this crate's build script sees the env
# scratchy-forwards.rs sees and generates facts for exactly the canonicals stage 2 emits. A feature
# scratchy-models forwards to the pipeline lib (`scratchy-forward-compiler-macro/<backend>`) forwards
# the same here, so this crate builds alone. The build script refuses any drift between the two
# tables (`check_feature_parity`).

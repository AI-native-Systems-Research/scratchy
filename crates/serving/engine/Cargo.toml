[package]
name = "scratchy-serving-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Engine core loop and request lifecycle for vLLM Rust port"

[features]
default = []
multiproc = ["scratchy-serving-transport/multiproc"]
guided-decoding = ["dep:llguidance", "dep:serde_json", "dep:toktrie", "dep:toktrie_hf_tokenizers"]

[dependencies]
scratchy-core-common = { workspace = true }
scratchy-core-config = { workspace = true }
scratchy-core-model = { workspace = true }
scratchy-serving-scheduler = { workspace = true }
scratchy-serving-transport = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true }
inventory = { workspace = true }
anyhow = { workspace = true }
llguidance = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
toktrie = { workspace = true, optional = true }
toktrie_hf_tokenizers = { workspace = true, optional = true }

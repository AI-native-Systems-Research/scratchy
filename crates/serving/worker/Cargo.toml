[package]
name = "scratchy-serving-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Worker/process management and distributed coordination for vLLM Rust port"

[features]
default = []
# Observability seams — forwarded to the metal target (where the hooks live) +
# core-common. Compiled into a plain engine build for none of it.
forward-telemetry = ["scratchy-target-metal?/forward-telemetry", "scratchy-core-common/forward-telemetry"]
sampler-telemetry = ["scratchy-target-metal?/sampler-telemetry", "scratchy-core-common/sampler-telemetry"]
cuda = ["cudarc", "dep:scratchy-forward-compiler", "dep:scratchy-models", "dep:scratchy-target-cuda", "dep:scratchy-builder-cuda", "scratchy-builder-cuda/cuda", "scratchy-forward-compiler/cuda", "scratchy-models/cuda", "scratchy-target-cuda/cuda"]
metal = ["dep:scratchy-forward-compiler", "dep:scratchy-models", "dep:scratchy-target-metal", "dep:objc2", "dep:objc2-metal", "dep:objc2-foundation", "scratchy-forward-compiler/metal", "scratchy-models/metal"]
# Multimodal capability, forwarded from `scr`'s `multimodal` feature via
# scratchy-serving-api. No-op unless a backend that has one is also active.
vision = ["scratchy-target-metal?/vision"]
nccl = ["cuda", "scratchy-forward-compiler/nccl", "scratchy-target-cuda/nccl", "scratchy-models/nccl"]
# IBM Spyre / KTIR: a host-only worker that runs the macro-emitted KTIR bundle
# on the ktir-emulator (no GPU toolchain). NEVER touches target-cuda: the
# neutral `GpuWeights` comes from scratchy-layers, the registry/`try_load` +
# `ScratchyWeights` from the compiler, `DType` from scratchy-tensors, and the host
# `SpyreAllocator` + bundle runner from target-spyre.
spyre = ["dep:scratchy-target-spyre", "dep:scratchy-forward-compiler", "dep:scratchy-models", "dep:scratchy-layers", "dep:scratchy-tensors", "dep:scratchy-subtile", "scratchy-target-spyre/runner", "scratchy-forward-compiler/spyre", "scratchy-models/spyre"]
# `--target sendnn`: on-silicon path. Same scratchy machinery as `spyre` but the
# session backend is target-spyre's sendnn GraphLoader runner (links the IBM
# Spyre SDK) — and crucially does NOT pull `runner`/ktir-emulator (whose `metal`
# feature drags in Apple-only objc2, breaking the Linux Spyre build).
sendnn = ["dep:rayon", "dep:scratchy-target-spyre", "dep:scratchy-forward-compiler", "dep:scratchy-models", "dep:scratchy-layers", "dep:scratchy-tensors", "dep:scratchy-builder-spyre", "dep:scratchy-subtile", "scratchy-builder-spyre/sendnn", "scratchy-target-spyre/sendnn", "scratchy-forward-compiler/spyre", "scratchy-models/spyre"]
# SuperDSC on-silicon path: the full `sendnn` runtime (shim + builder + SDK) PLUS
# the SuperDSC emit selection forwarded to the models/compiler. A cargo feature
# (`--features superdsc`), NOT an env var — the macro emits the work-divided
# SuperDSC bundle and the worker routes it via the SUPERDSC_BUNDLE sentinel.
superdsc = ["sendnn", "scratchy-models/superdsc", "scratchy-forward-compiler/superdsc"]
guided-decoding = ["scratchy-core-model/guided-decoding", "scratchy-target-cuda?/guided-decoding"]

[dependencies]
# Only the sendnn weight-load path fans the bf16→f16 narrowing across cores; pulled
# in by the `sendnn` feature, absent from the host/cuda/metal builds.
rayon = { workspace = true, optional = true }
scratchy-target-cuda = { path = "../../targets/cuda", optional = true }
scratchy-target-spyre = { path = "../../targets/spyre", optional = true }
scratchy-core-common = { workspace = true }
scratchy-core-config = { workspace = true }
scratchy-serving-scheduler = { workspace = true }
scratchy-serving-engine = { workspace = true }
scratchy-core-model = { workspace = true }
scratchy-quantizations = { workspace = true }
scratchy-forward-compiler = { path = "../../compiler", optional = true }
scratchy-models = { path = "../../models/arch", optional = true, default-features = false }
# SuperDSC weight staging shares the emitter's TYPE-SAFE `DeviceWidth` (padding/alignment lock-down) so the
# staged weight width == the emitted device width by construction. Optional; enabled by spyre/sendnn.
scratchy-subtile = { path = "../../compiler/subtile", optional = true, features = ["spyre"] }
# Spyre rides the neutral seam directly (never target-cuda): GpuWeights from
# scratchy-layers, DType from scratchy-tensors.
scratchy-layers = { path = "../../layers", optional = true }
scratchy-tensors = { path = "../../tensors", optional = true }
# Build-time + link anchor only: depending on the kernel builder triggers .cu
# compilation (the static `.a` cache `scratchy-target-cuda/build.rs` links
# against), and `gpu_worker.rs`'s `extern crate scratchy_builder_cuda as _`
# keeps it in the link graph. No code is imported from it.
scratchy-builder-cuda = { path = "../../targets/cuda/builder", optional = true }
# Build-time AoT g2 bake (peer of scratchy-builder-cuda): pulled in by the
# worker's `sendnn` feature so its build.rs CompileGraphs the sengraphs on the
# card at `cargo build` and bakes the g2 blobs. The worker calls its
# `baked_g2(fp)` lookup at session-create to load `already_compiled=true`.
scratchy-builder-spyre = { path = "../../targets/spyre/builder", optional = true }
scratchy-target-metal = { path = "../../targets/metal", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-metal = { version = "0.3", optional = true }
objc2-foundation = { version = "0.3", optional = true }
half = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cudarc = { workspace = true, optional = true }
rand = { workspace = true }
bincode = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
safetensors = { workspace = true }

[package]
name = "scratchy-serving-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Worker/process management and distributed coordination for vLLM Rust port"

[features]
default = []
guided-decoding = ["scratchy-serving-engine/guided-decoding"]

# Target-neutral: the `Worker` trait, the executors, and the `WorkerFactory` registry. Every
# concrete worker lives in its target (`crates/targets/<target>/worker`) and registers itself.
[dependencies]
scratchy-core-common = { workspace = true }
scratchy-core-config = { workspace = true }
scratchy-serving-scheduler = { workspace = true }
scratchy-serving-engine = { workspace = true }
scratchy-serving-transport = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }
safetensors = { workspace = true }

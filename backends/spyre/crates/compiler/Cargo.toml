[package]
name = "scratchy-target-spyre-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Spyre's compile-time emission: the per-model bundle bake (SubtileTape -> KTIR / SuperDSC) the shared pipeline calls through `TargetEmitter`"

[features]
default = []
# THE CARD'S LOWERING, with no device compile: every rung a card bakes, lowered through the card's
# path and refused where it does not lower, and no device image. What CI runs for a card's ladder.
spyre-lower = ["scratchy-target-spyre/spyre-lower"]
# A CARD. The device image is compiled from the KTIR at bake time, so this build has a device
# compiler to drain; the emulator build has nothing to compile and nothing to wait for.
spyre-hw = ["spyre-lower", "scratchy-target-spyre/spyre-hw"]
# THE EMULATOR — and with it the bake-time NUMERIC GATE: every decode bundle the bake produces runs
# on ktir-emulator under the synthetic probe and is compared against the reference semantics of the
# same dsl_math; divergence beyond the quant floor fails the build.
spyre-emu = ["scratchy-target-spyre/spyre-emu"]
# `tp-<W>` — bake a W-RANK tensor-parallel world beside every model's one-rank forward: the shared
# analysis (`scratchy_subtile::tensor_parallel::shard`) shards the decode and prefill tapes, and the
# same bake produces the rank-local bundles. Off by default — a build bakes a world only when it
# names it (`tp/2` from scratchy-cli).
tp-2 = ["scratchy-target-spyre/tp-2"]
tp-4 = ["scratchy-target-spyre/tp-4"]
tp-8 = ["scratchy-target-spyre/tp-8"]

[dependencies]
# The shared pipeline this crate's emitter plugs into (`target::TargetEmitter`), and the passes the
# bake reads (`to_wavefront`, `shape`, `config`, ...).
scratchy-forward-compiler-macro = { path = "../../../../crates/compiler/macros" }
scratchy-forward-compiler-frontend = { path = "../../../../crates/compiler/frontend" }
# The target: the lowering the bake drives, and the types the baked program is rendered as.
scratchy-target-spyre = { path = "../spyre", default-features = false }
# The IR types the baked program is CONSTRUCTED from — rendered here as const tokens, so this
# crate names the same types the lowering built.
ktir-core = { path = "../ktir/ktir-core" }
# The splice's own fp8-epilogue facts (`FP8_EPILOGUE_LIVE_TILES`, `fp8_epilogue_peak_bytes`) — the
# emu prefill-width derivation reads the count from beside the program it describes.
scratchy-triton-splice = { path = "../triton/splice" }
scratchy-subtile = { path = "../../../../crates/compiler/subtile" }
# The SuperDSC device facts the bake states its ladders and budgets in (`sdsc_abstract`,
# `superdsc_opspec`).
ktir-superdsc = { path = "../ktir/ktir-superdsc" }
scratchy-ir = { path = "../../../../crates/compiler/ir" }
scratchy-tp-world = { path = "../../../../crates/core/tp-world" }
proc-macro2 = "1"
quote = "1"
syn = { version = "3", features = ["full"] }
rayon = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }

# The pipeline's real-config fixtures, for the bake's tests on checked-in models.
[dev-dependencies]
scratchy-forward-compiler-macro = { path = "../../../../crates/compiler/macros", features = ["test-support"] }

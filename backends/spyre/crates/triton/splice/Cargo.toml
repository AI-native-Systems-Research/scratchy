[package]
name = "scratchy-triton-splice"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

# The splice: a SubtileTape node whose KTIR comes from a Triton kernel
# (backends/spyre/crates/triton/PROVENANCE.md), compiled at `#[forward]` expansion time. A LEAF
# between the two ladders: scratchy-subtile (the tape types) below, the re-hosted
# Triton front end above. scratchy-target-spyre routes every spliced op kind
# through it unconditionally — the target crate gains a hook, not a second copy of
# the lowering.

[features]
# THE BUILD'S KV POOL (`KvPool::BUILD`): fp8 E4M3 pages, written narrowed and read widened by every
# paged kernel's fp8-pool twin.
kv-fp8 = []

[dependencies]
scratchy-subtile = { path = "../../../../../crates/compiler/subtile" }
scratchy-ir = { path = "../../../../../crates/compiler/ir" }
ktir-core = { path = "../../ktir/ktir-core" }
scratchy-spyre-bundle = { path = "../../bundle" }
spyre-superdsc = { package = "scratchy-spyre-superdsc", path = "../../superdsc" }
# ⭐ THE RUST LADDER, from this workspace's own re-host. `codegen::compile` parses `.py`
# kernels with the OWNED parser (`triton-frontend/src/py/parser.rs`), which the splice
# does at expansion time. The ladder is dependency-free offline
# (backends/spyre/crates/triton/PROVENANCE.md, copy rule 2) — no crates.io package regardless.
triton-frontend = { path = "../triton-frontend" }
triton-ktir = { path = "../triton-ktir" }

[dev-dependencies]
# The byte-identity dump's per-op stable text: `wire::SdscOp` derives `Serialize`,
# so the dump serializes each emitted op rather than `Debug`-printing it (floats
# and maps must render identically across runs for the diff to mean anything).
serde_json = { workspace = true }

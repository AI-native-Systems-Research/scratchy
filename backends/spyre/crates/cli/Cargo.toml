[package]
build = "build.rs"
name = "scratchy-target-spyre-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "`spyre`: the scratchy CLI on IBM Spyre — the shared commands, served through the spyre worker"

[features]
# The in-process engine (`spyre chat`); `serve` adds the HTTP server.
default = ["chat"]
chat = ["scratchy-cli/chat"]
serve = ["scratchy-cli/serve"]
claude = ["scratchy-cli/claude"]
bench = ["scratchy-cli/bench"]
bench-datasets = ["scratchy-cli/bench-datasets"]
guided-decoding = ["scratchy-cli/guided-decoding"]
otel = ["scratchy-cli/otel"]
tls = ["scratchy-cli/tls"]
metrics = ["scratchy-cli/metrics"]
# Shell tab completion over real HuggingFace model ids, resolved against huggingface.co at build
# time (see scratchy-models' `hf-completions`). Off by default: a card host's build is air-gapped.
hf-completions = ["model/hf-completions"]
# ANY CARD — the SDK and the builder. `main.rs`'s `libc::_exit` (senlib's atexit faults, so the
# process must not run it) and `spyre bundle run` are this tier's.
spyre-hw = [
  "scratchy-target-spyre-worker/spyre-hw",
  # `spyre bundle run`: the card's executor, directly.
  "dep:scratchy-target-spyre-card",
]
# THE EMULATOR — a sibling of the card, not its absence.
spyre-emu = ["scratchy-target-spyre-worker/spyre-emu"]

[[bin]]
name = "spyre"
path = "src/main.rs"

[dependencies]
# The shared commands (`scratchy_cli::run`), with model-name completion.
scratchy-cli = { workspace = true, features = ["model"] }
# The spyre worker: the `WorkerFactory` the engine serves through. `main.rs` anchors it.
scratchy-target-spyre-worker = { workspace = true }
# `spyre bundle run` ONLY: launching a bundle this binary did not bake needs the card's executor
# directly. Reachable only under `spyre-hw`.
scratchy-target-spyre-card = { path = "../card", optional = true }
# THE MODEL SCOPE, for CLI feature reachability: `--features model/<stem>` selects through
# scratchy-models' own features, as `scr`'s `model` alias does (the same package, so the same
# features). `quant` and `tp` likewise: `--features quant/<preset>`, `--features tp/<W>`.
model = { package = "scratchy-models", path = "../../../../crates/models/arch", default-features = false }
tp = { package = "scratchy-tp", path = "../tp", optional = true }
quant = { package = "scratchy-quantizations", path = "../../../../crates/models/quantization", default-features = false }
clap = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
anyhow = { workspace = true }
dotenvy = { workspace = true }
libc = { workspace = true }

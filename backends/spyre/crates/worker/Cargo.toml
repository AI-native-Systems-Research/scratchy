[package]
name = "scratchy-target-spyre-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The spyre worker: the serving `Worker` over the spyre target (card or emulator), registered as a `WorkerFactory`"

[features]
default = []
# A CARD, any revision — the card runtime, over the shared machinery below. It does NOT pull
# `spyre-emu`/ktir-emulator, whose `metal` feature drags in Apple-only objc2 and would break a Linux
# card build. The models it compiles against are the card's LOWERING (`spyre-lower`): the worker's
# code is the same with or without device images, so it type-checks with no device compiler. The
# binary that runs on a card turns the device compile on (the CLI's `spyre-hw`).
spyre-hw = ["dep:scratchy-builder-spyre", "scratchy-builder-spyre/spyre-hw", "dep:scratchy-target-spyre-card", "scratchy-target-spyre-models/spyre-lower"]
# THE EMULATOR — a SIBLING of the card, not its absence. Same bundles, same launch sequence; what
# differs is the device underneath. Forwards into the models crate so the bake-time
# numeric gate runs on every emu build (see scratchy-target-spyre-compiler's `spyre-emu`).
spyre-emu = ["scratchy-target-spyre/spyre-emu", "scratchy-target-spyre-models/spyre-emu"]
# A W-RANK TENSOR-PARALLEL WORLD: the bake shards every model W ways (scratchy-target-spyre-models/tp-<W>) and
# this worker runs every rank in one process, one card each, linked by device p2p RDMA. A build that
# names no world serves one card. Reached from the CLI as `tp/<W>`.
tp-2 = ["spyre-hw", "scratchy-target-spyre-models/tp-2", "scratchy-target-spyre/tp-2", "scratchy-target-spyre-card/tp-2"]
tp-4 = ["spyre-hw", "scratchy-target-spyre-models/tp-4", "scratchy-target-spyre/tp-4", "scratchy-target-spyre-card/tp-4"]
tp-8 = ["spyre-hw", "scratchy-target-spyre-models/tp-8", "scratchy-target-spyre/tp-8", "scratchy-target-spyre-card/tp-8"]

[dependencies]
scratchy-target-spyre = { path = "../spyre" }
# The card runtime (the resident executor, its session, the cards): the `spyre-hw` run path's.
scratchy-target-spyre-card = { path = "../card", optional = true }
scratchy-serving-worker = { workspace = true }
scratchy-serving-engine = { workspace = true }
scratchy-serving-scheduler = { workspace = true }
scratchy-core-common = { workspace = true }
scratchy-core-model = { workspace = true }
scratchy-forward-compiler = { path = "../../../../crates/compiler" }
# The selected models, compiled for spyre: their loaders and baked bundles, found through the
# `SpyreArchRegistration` rows they submit.
scratchy-target-spyre-models = { path = "../models" }
# Weight staging shares the emitter's TYPE-SAFE `DeviceWidth` (padding/alignment lock-down) so the
# staged weight width == the emitted device width by construction.
scratchy-subtile = { path = "../../../../crates/compiler/subtile" }
# The SuperDSC device facts (`sdsc_abstract`, `superdsc_opspec`): the laws the staging and the
# session setters mint their values through.
ktir-superdsc = { path = "../ktir/ktir-superdsc" }
# Spyre rides the neutral seam directly: GpuWeights from scratchy-layers, DType from
# scratchy-tensors.
scratchy-layers = { path = "../../../../crates/layers" }
scratchy-tensors = { path = "../../../../crates/tensors" }
# Build-time bake on the CARD: pulled in by `spyre-hw`, so its build.rs runs at `cargo build`
# rather than at load.
scratchy-builder-spyre = { path = "../builder", optional = true }
# The weight-load path fans the bf16→f16 narrowing across cores.
rayon = { workspace = true }
half = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
inventory = { workspace = true }

[dev-dependencies]
safetensors = { workspace = true }

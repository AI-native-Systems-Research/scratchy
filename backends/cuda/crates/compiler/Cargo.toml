[package]
name = "scratchy-target-cuda-compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CUDA's compile-time lowering: SubtileTape -> CUDA step tape"

# ⭐ WHY THIS CRATE EXISTS.
#
# CUDA's expansion-time lowering cannot live in `scratchy-target-cuda` itself, for the same reason
# metal's could not (`crates/targets/metal/compiler/Cargo.toml`): it plugs into the shared pipeline
# (`scratchy-forward-compiler-macro`'s `TargetEmitter`), and the runtime target crate depends UP on
# `scratchy-forward-compiler` ("the inverted edge"), so lowering inside the runtime crate would tie
# the runtime to the pipeline.
#
# The fix is a crate on the target's side of that edge:
#
#   scratchy-subtile          (handoff types + the shared SubtileIR/SubtileTape and passes)
#        |                 \
#   scratchy-target-cuda     scratchy-target-cuda-compiler   <- CUDA's codegen lives HERE
#                           /
#   scratchy-forward-compiler-macro   (the pipeline it implements `TargetEmitter` for)
#
# This is a COMPILE-TIME crate, never linked into the runtime. CUDA's models build
# (`scratchy-target-cuda-models`) hands the shared models build driver its emitter, `Cuda`;
# everything CUDA decides about a model is here.
[features]
# `target_model_inputs`: the pipeline with `Cuda`, returning each model's handoff for a test.
test-support = []

[dependencies]
# The shared pipeline this crate's emitter plugs into (`target::TargetEmitter`).
scratchy-forward-compiler-macro = { path = "../../../../crates/compiler/macros" }
scratchy-subtile = { path = "../../../../crates/compiler/subtile" }
# The model facts (`scratchy_ir::model_facts`): the `Attention` value the attention ops carry.
scratchy-ir = { path = "../../../../crates/compiler/ir" }
# The rope base (`RopeTheta`) the handoff carries and the rotary table holds.
scratchy-tensors = { path = "../../../../crates/tensors" }
scratchy-target-cuda = { path = "../cuda" }
# The tokens of the `static` tapes `emit` hands back, rendered by the shared serializer under
# CUDA's module table.
scratchy-const-tokens = { path = "../../../../crates/compiler/const-tokens" }
proc-macro2 = "1"
quote = "1"

# The CUDA target is its own workspace, apart from the root one: nothing in the root workspace
# depends on it. Its crates are under `crates/`, as the root's are; it reaches the shared ones by
# path into the root's `crates/`. Its kernels are under `kernels/` (ThunderKittens vendored at
# `kernels/thunderkittens/`), compiled only under the `nvcc` feature, so CI lints and tests the
# whole workspace with no CUDA toolchain.
[workspace]
resolver = "2"
default-members = ["crates/cli"]
members = [
    "crates/cuda",
    "crates/compiler",
    "crates/worker",
    "crates/models",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# The same requirements as the root workspace's rows of the same names (its comments say why).
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
half = "2.7"
inventory = "0.3"
safetensors = { version = "0.8", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
tracing = "0.1"

# The shared crates, from the root workspace.
scratchy-cli = { path = "../../crates/cli/scr", default-features = false }
scratchy-core-common = { path = "../../crates/core/common" }
scratchy-core-model = { path = "../../crates/core/model" }
scratchy-serving-engine = { path = "../../crates/serving/engine" }
scratchy-serving-scheduler = { path = "../../crates/serving/scheduler" }

scratchy-target-cuda-worker = { path = "crates/worker" }

# Profiles apply only from a workspace root, so these repeat the root workspace's (its comments
# say why each is set), for CUDA's own compiled models.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.scratchy-target-cuda-models]
debug = 0

[profile.dev.build-override]
opt-level = 3

[profile.release.build-override]
opt-level = 3

[profile.release.package.scratchy-target-cuda-models]
debug = 0
opt-level = 1

[profile.release-dist]
inherits = "release"
strip = true
lto = "fat"
codegen-units = 1

[profile.release-dist.package.scratchy-target-cuda-models]
opt-level = 3

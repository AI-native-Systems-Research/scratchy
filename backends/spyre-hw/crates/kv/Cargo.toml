[package]
name = "scratchy-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KV cache build scope: the element format the KV pools hold (`kv/<format>` from the spyre CLI)."

[features]
# A crate of its own for the reason scratchy-tp is one: Cargo forbids aliasing one crate under two
# names in one Cargo.toml, so `--features kv/fp8` needs a package named `kv`. `fp8` (the spyre CLI's
# card default (`spyre-hw`)) selects the float8 e4m3 KV cache (the shared `KvCodec::Fp8E4m3`) for
# every model the build bakes whose KV heads are whole float8 sticks; the rest keep their 16-bit
# pool.
fp8 = ["scratchy-target-spyre-worker/kv-fp8"]
# `dense` keeps every model's 16-bit pool, and wins over `fp8` when named: an fp16-KV build is
# `--features kv/dense`, with no `--no-default-features`.
dense = ["scratchy-target-spyre-worker/kv-dense"]

[dependencies]
scratchy-target-spyre-worker = { workspace = true }

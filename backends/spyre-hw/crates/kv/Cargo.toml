[package]
name = "scratchy-kv"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KV cache build scope: the element format the KV pools hold (`kv/<format>` from the spyre CLI)."

[features]
# A crate of its own for the reason scratchy-tp is one: Cargo forbids aliasing one crate under two
# names in one Cargo.toml, so `--features kv/fp8` needs a package named `kv`. Naming it selects the
# float8 e4m3 pool (scratchy-triton-splice's `KvFormat`) for every model the build bakes; naming none
# keeps the model's 16-bit pool.
fp8 = ["scratchy-target-spyre-worker/kv-fp8"]

[dependencies]
scratchy-target-spyre-worker = { workspace = true }

[package]
name = "scratchy-builder-spyre"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build-graph placeholder. The dxp compile moved into the #[forward] emit, which submits the compiled device code to the bundle registry; nothing is compiled or baked here."

[features]
default = []
# Kept so the feature wiring that names `scratchy-builder-spyre/spyre-hw` keeps resolving. It
# turns nothing on: the dxp compile happens inside the `#[forward]` emit and its output goes
# into the binary via inventory.
spyre-hw = []

# ⛔ NO BUILD-DEPENDENCY ON `scratchy-models`. It would only be an ORDERING LEVER — a
# build-dependency is the only edge cargo fully builds before a build script runs, so depending on the
# model crate here would guarantee the `#[forward]` emit filled a bundle cache before this crate's
# build.rs walked it. There is no such cache (the emit compiles its own groups and embeds the result),
# so the lever has nothing to order — and it is expensive: a build-dependency compiles for the
# HOST while the worker's normal edge compiles for the TARGET, which means TWO cargo units each
# running the full model emission, in parallel, both writing the same ~13 GB.

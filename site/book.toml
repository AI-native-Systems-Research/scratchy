[book]
title = "Scratchy"
description = "A hyper-specializing inference stack compiler"
authors = ["AI-native Systems Research"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
# `light` and `navy` are restyled by theme/scratchy.css into the light and dark
# faces of the landing page, so the book tracks the reader's system preference
# exactly as the landing page does.
default-theme = "light"
preferred-dark-theme = "navy"
# Carbon's side nav labels entries, it does not number them.
no-section-label = true
additional-css = ["theme/scratchy.css"]
git-repository-url = "https://github.com/AI-native-Systems-Research/scratchy"
site-url = "/scratchy/book/"

[output.html.fold]
enable = true
level = 1

[package]
name = "scratchy-site"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Renders the GitHub Pages site into site/_site at build time."

# Not a member of the repo's workspace: the site is built by its own job
# (.github/workflows/pages.yml), and the workspace-wide clippy gates should
# never compile a web framework.
[workspace]

[dependencies]
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals", "hooks"] }
dioxus-ssr = "0.7"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
